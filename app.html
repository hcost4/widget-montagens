<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
<meta charset="utf-8" />
<title>Status de Montagens</title>
<meta name="author" content="SKA" />
<meta name="description" content="Status de maturidade, pendências e alertas de uma montagem da 3DEXPERIENCE." />
<meta name="apiVersion" content="1.3" />
<meta name="debugMode" content="false" />
<meta name="strictMode" content="false" />
<script type="text/javascript" src="https://uwa.netvibes.com/lib/c/UWA/js/UWA_Standalone_Alone.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #1A1A1A; }
  .sm-root {
    --fundo: #1A1A1A; --card: #26292C; --card2: #2E3236; --borda: #3A3D40; --borda-forte: #4A4E53;
    --texto: #C9CDD1; --titulo: #FFFFFF; --texto2: #C9CDD1; --texto3: #9AA0A6;
    --destaque: #BAD532; --destaque-h: #CBE34F; --destaque-escuro: #8FA326; --link: #BAD532;
    --c-lib: #0ca30c; --c-cong: #3987e5; --c-trab: #d95926; --c-priv: #9085e9; --c-obs: #8a8984; --c-falta: #4A4E53;
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, Arial, sans-serif; color: var(--texto); font-size: 14px; line-height: 1.45;
    box-sizing: border-box; height: 100vh; overflow-y: auto; background: var(--fundo); color-scheme: dark;
  }
  .sm-root * { box-sizing: border-box; }
  .sm-root h1, .sm-root h2, .sm-root h3, .sm-kpi .v, .sm-meta-num strong { font-family: "Space Grotesk", "Plus Jakarta Sans", Arial, sans-serif; }
  .sm-app { max-width: 1440px; margin: 0 auto; padding: 0 0 24px; }

  /* barra superior */
  .sm-topo { background: #141414; border-bottom: 1px solid var(--borda); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 20px; }
  .sm-marca { display: flex; align-items: center; gap: 14px; }
  .sm-logo { height: 20px; width: auto; display: block; }
  .sm-sep { width: 1px; height: 22px; background: var(--borda-forte); }
  .sm-marca h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--titulo); letter-spacing: 0.2px; }
  .sm-selo { font-size: 11px; font-weight: 700; color: #1A1A1A; background: var(--destaque); padding: 2px 8px; border-radius: 10px; }
  .sm-conexao { font-size: 12px; color: var(--texto3); }

  /* barra de busca */
  .sm-barra { background: var(--fundo); border-bottom: 1px solid var(--borda); padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .sm-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sm-busca { position: relative; }
  .sm-busca svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--texto3); pointer-events: none; }
  .sm-busca input { height: 40px; width: 360px; max-width: 70vw; padding: 0 12px 0 36px; border: 1px solid var(--borda-forte); border-radius: 8px; font: inherit; color: var(--titulo); background: var(--card); }
  .sm-busca input::placeholder { color: var(--texto3); }
  .sm-busca input:focus, .sm-campo input:focus { outline: 2px solid var(--destaque); outline-offset: 0; border-color: var(--destaque); }
  .sm-lido { font-size: 12px; color: var(--texto3); }
  .sm-btn { height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--destaque); color: #1A1A1A; font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .sm-btn:hover { background: var(--destaque-h); }
  .sm-btn[disabled] { background: #4A4E53; color: #9AA0A6; cursor: default; }
  .sm-btn2 { height: 40px; padding: 0 12px; border: 1px solid var(--borda-forte); border-radius: 8px; background: var(--card); color: var(--titulo); font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .sm-btn2:hover { background: var(--card2); border-color: #5A5F65; }
  .sm-btn2[disabled] { color: #6B7076; cursor: default; background: var(--card); border-color: var(--borda); }
  .sm-btn2[aria-expanded="true"] { border-color: var(--destaque); color: var(--destaque); }

  /* configurações */
  .sm-config { background: #202326; border-bottom: 1px solid var(--borda); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .sm-config[hidden] { display: none; }
  .sm-campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--texto3); font-weight: 600; }
  .sm-campo input { height: 38px; padding: 0 10px; border: 1px solid var(--borda-forte); border-radius: 8px; font: inherit; font-weight: 400; color: var(--titulo); background: var(--card); }
  .sm-config .sm-nota { margin: 0; align-self: center; }

  .sm-corpo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  #sm-conteudo { display: flex; flex-direction: column; gap: 16px; }
  #sm-aviso:empty { display: none; }

  /* cartões */
  .sm-caixa, .sm-cartao { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 18px 20px; }
  .sm-caixa h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; color: var(--titulo); }
  .sm-cartao-t { margin: 0; font-size: 12px; font-weight: 700; color: var(--destaque); text-transform: uppercase; letter-spacing: 1.5px; font-family: "Plus Jakarta Sans", Arial, sans-serif !important; }
  .sm-cartao-s { margin: 4px 0 0; font-size: 12px; color: var(--texto3); }

  /* cabeçalho da montagem */
  .sm-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; position: relative; overflow: hidden; }
  .sm-cab::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--destaque); }
  .sm-cab-img { width: 96px; height: 72px; border: 1px solid var(--borda); border-radius: 10px; background: #F4F5F6; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  .sm-cab-img img { max-width: 100%; max-height: 100%; }
  .sm-cab h2 { margin: 0; font-size: 24px; font-weight: 500; color: var(--titulo); word-break: break-word; }
  .sm-cab-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--texto3); }

  /* resumo com gráficos */
  .sm-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .sm-graf { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 16px; }
  .sm-graf svg { flex: none; }
  .sm-leg { list-style: none; margin: 0; padding: 0; flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .sm-leg li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13px; color: var(--texto); }
  .sm-leg .q { width: 12px; height: 12px; border-radius: 3px; }
  .sm-leg .n { font-weight: 700; color: var(--titulo); text-align: right; min-width: 24px; }
  .sm-leg .p { color: var(--texto3); text-align: right; min-width: 36px; font-size: 12px; }
  .sm-carregando { display: flex; align-items: center; gap: 10px; color: var(--texto3); font-size: 13px; margin-top: 16px; min-height: 140px; }

  /* meta */
  .sm-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
  .s-ok { background: rgba(12,163,12,0.18); color: #6FD66F; } .s-atencao { background: rgba(250,178,25,0.16); color: #F5C75A; } .s-vencido { background: rgba(208,59,59,0.2); color: #F08A8A; } .s-neutro { background: #3A3D40; color: #C9CDD1; }
  .sm-meta-num { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .sm-meta-num strong { font-size: 40px; font-weight: 600; line-height: 1; color: var(--titulo); }
  .sm-meta-num span { color: var(--texto3); font-size: 13px; }
  .sm-medidor { position: relative; height: 12px; background: #3A3D40; border-radius: 6px; margin: 16px 0 6px; }
  .sm-medidor .barra { height: 12px; border-radius: 6px; background: var(--destaque); }
  .sm-medidor .alvo { position: absolute; top: -5px; width: 2px; height: 22px; background: var(--titulo); }
  .sm-medidor-r { position: relative; display: flex; justify-content: space-between; font-size: 11px; color: var(--texto3); height: 14px; }
  .sm-medidor-r .m { position: absolute; top: 0; transform: translateX(-50%); color: var(--titulo); font-weight: 600; white-space: nowrap; }
  .sm-meta-dados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
  .sm-meta-dados div span { display: block; font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: 0.8px; }
  .sm-meta-dados div strong { display: block; font-size: 18px; font-weight: 600; margin-top: 2px; color: var(--titulo); }

  /* indicadores */
  .sm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .sm-kpi { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
  .sm-kpi .r { font-size: 12px; color: var(--texto3); font-weight: 600; }
  .sm-kpi .v { font-size: 30px; font-weight: 600; line-height: 1.15; color: var(--titulo); }
  .sm-kpi .d { font-size: 12px; color: var(--texto3); }
  .sm-kpi.alerta .v { color: #F08A8A; }
  .sm-kpi.atencao .v { color: #F5C75A; }
  .sm-ponto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* abas */
  .sm-abas-caixa { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
  .sm-abas { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--borda); padding: 0 14px; background: #222528; }
  .sm-aba { border: 0; background: none; font: inherit; color: var(--texto3); padding: 13px 12px 10px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; font-weight: 600; }
  .sm-aba:hover { color: var(--titulo); }
  .sm-aba[aria-selected="true"] { color: var(--titulo); border-bottom-color: var(--destaque); }
  .sm-aba .cont { font-size: 11px; font-weight: 700; background: #3A3D40; color: var(--texto); padding: 1px 8px; border-radius: 10px; }
  .sm-aba[aria-selected="true"] .cont { background: var(--destaque); color: #1A1A1A; }
  .sm-aba .cont.alerta { background: rgba(208,59,59,0.25); color: #F08A8A; }
  .sm-painel { padding: 16px 20px; }
  .sm-painel-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sm-painel-topo p { margin: 0; color: var(--texto3); font-size: 13px; }

  /* tabelas */
  .sm-tabela { overflow-x: auto; }
  .sm-tabela table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sm-tabela th { text-align: left; font-weight: 700; color: var(--texto3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 9px 8px; border-bottom: 1px solid var(--borda); white-space: nowrap; background: #222528; }
  .sm-tabela td { padding: 8px; border-bottom: 1px solid #313437; vertical-align: middle; color: var(--texto); }
  .sm-tabela tbody tr:hover td { background: #2C3034; }
  .sm-tabela tr.marcada td { background: rgba(208,59,59,0.07); }
  .num { text-align: right; }
  .sm-mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--texto3); }
  .sm-tabela strong { color: var(--titulo); }

  /* estados e etiquetas */
  .sm-est { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; background: #3A3D40; color: #C9CDD1; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .sm-est::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .e-RELEASED { background: rgba(12,163,12,0.18); color: #6FD66F; } .e-FROZEN { background: rgba(57,135,229,0.2); color: #8DBBF2; } .e-IN_WORK { background: rgba(217,89,38,0.2); color: #F39A70; } .e-PRIVATE { background: rgba(144,133,233,0.2); color: #BDB5F5; } .e-OBSOLETE { background: #3A3D40; color: #C9CDD1; }
  .sm-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; display: inline-block; }
  .t-pai { background: rgba(208,59,59,0.2); color: #F08A8A; }
  .t-parado { background: rgba(250,178,25,0.16); color: #F5C75A; }
  .t-2d { background: rgba(186,213,50,0.16); color: var(--destaque); }
  .t-res { background: rgba(144,133,233,0.2); color: #C9C2F7; display: inline-flex; align-items: center; gap: 4px; }
  .t-rev { background: rgba(57,135,229,0.2); color: #8DBBF2; }
  .sm-cab-meta .sm-tag { font-size: 12px; }
  .sm-sub { margin: 22px 0 10px; font-size: 12px; font-weight: 700; color: var(--destaque); text-transform: uppercase; letter-spacing: 1.2px; }
  button.sm-kpi { font: inherit; text-align: left; cursor: pointer; color: inherit; }
  button.sm-kpi:hover { border-color: #5A5F65; background: var(--card2); }
  button.sm-kpi.ativo { border-color: var(--destaque); box-shadow: 0 0 0 1px var(--destaque) inset; }
  .sm-fatia { cursor: pointer; transition: stroke-width 0.15s; }
  .sm-fatia:hover { stroke-width: 22; }
  .sm-leg li { display: block; }
  .sm-leg-btn { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font: inherit; font-size: 13px; color: var(--texto); background: none; border: 0; border-radius: 6px; padding: 4px 6px; margin: -4px -6px; cursor: pointer; text-align: left; }
  .sm-leg-btn:hover { background: var(--card2); }
  .sm-leg-btn[disabled] { cursor: default; opacity: 0.6; }
  .sm-leg-btn[disabled]:hover { background: none; }
  .sm-barra-est { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: #3A3D40; }
  .c-RELEASED { background: var(--c-lib); } .c-FROZEN { background: var(--c-cong); } .c-IN_WORK { background: var(--c-trab); } .c-PRIVATE { background: var(--c-priv); } .c-OBSOLETE { background: var(--c-obs); } .c-OUTRO { background: #6B7076; }

  /* árvore */
  .sm-tg { width: 26px; height: 26px; border: 1px solid var(--borda-forte); border-radius: 6px; background: var(--card2); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--titulo); flex: none; }
  .sm-tg:hover { border-color: var(--destaque); color: var(--destaque); }
  .sm-tg-vazio { display: inline-block; width: 26px; flex: none; }
  .sm-nome { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--titulo); }
  .sm-filhos { font-size: 11px; color: var(--texto3); }
  .sm-thumb { width: 64px; height: 48px; border: 1px solid var(--borda); border-radius: 6px; background: #F4F5F6; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .sm-thumb img { max-width: 100%; max-height: 100%; display: block; }
  .sm-thumb.vazio { color: var(--texto3); font-size: 10px; background: var(--card2); }
  .sm-tabela td.sm-celthumb { padding: 4px 8px; width: 80px; }
  .sm-thumb-btn { padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 6px; }
  .sm-thumb-btn:hover .sm-thumb, .sm-thumb-btn:focus-visible .sm-thumb { border-color: var(--destaque); box-shadow: 0 0 0 2px rgba(186,213,50,0.35); }
  .sm-thumb-btn:hover .sm-cab-img { border-color: var(--destaque); }
  .sm-tabela tr.sm-linha2d td { background: #23272A; }
  .sm-link2d { border: 0; background: none; padding: 0; font: inherit; color: var(--destaque); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }
  .sm-link2d:hover { color: var(--destaque-h); }
  .sm-nova-versao { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 8px 20px; background: rgba(186,213,50,0.14); color: var(--titulo); font-size: 13px; border-bottom: 1px solid var(--borda); }
  .sm-nova-versao[hidden] { display: none; }
  .sm-nova-versao .sm-btn2 { height: 32px; }
  .sm-check { display: flex; gap: 10px; align-items: flex-start; max-width: 460px; cursor: pointer; font-size: 13px; color: var(--texto); }
  .sm-check input { width: 18px; height: 18px; margin-top: 2px; accent-color: #BAD532; flex: none; }
  .sm-check small { display: block; color: var(--texto3); font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .sm-root { position: relative; }
  .sm-soltar { display: none; position: absolute; inset: 8px; z-index: 50; border: 3px dashed var(--destaque); border-radius: 16px; background: rgba(26,26,26,0.82); align-items: center; justify-content: center; pointer-events: none; }
  .sm-soltar span { font-size: 18px; font-weight: 700; color: var(--destaque); background: #1A1A1A; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--borda); }
  .sm-root.sm-soltando .sm-soltar { display: flex; position: fixed; }
  [draggable="true"] { -webkit-user-drag: element; }
  .sm-link3d[draggable="true"]:active, .sm-link2d[draggable="true"]:active { cursor: grabbing; }
  .sm-kpi.minhas { border-color: rgba(186,213,50,0.55); background: linear-gradient(180deg, rgba(186,213,50,0.10), rgba(186,213,50,0.02)); }
  .sm-kpi.minhas .v { color: var(--destaque); }
  .t-minha { background: rgba(186,213,50,0.18); color: var(--destaque); }
  .sm-acoes-aviso { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-left: 8px; vertical-align: middle; }
  .sm-acoes-aviso .sm-btn, .sm-acoes-aviso .sm-btn2 { height: 34px; }
  .sm-prog-pdf { display: flex; flex-direction: column; gap: 8px; }
  .sm-prog-topo { display: flex; align-items: center; gap: 10px; }
  .sm-prog-topo strong { color: var(--titulo); }
  .sm-prog-tempo { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--texto3); font-size: 12px; }
  .sm-prog-etapa { font-size: 13px; }
  .sm-prog-det { font-size: 12px; color: var(--texto3); }
  .sm-prog-pdf .sm-barra-prog { max-width: none; }
  .sm-prog-pdf .sm-btn2 { align-self: flex-start; height: 32px; }
  .sm-girando { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(186,213,50,0.25); border-top-color: var(--destaque); animation: sm-gira 0.8s linear infinite; flex: none; }
  @keyframes sm-gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sm-girando { animation-duration: 2.4s; } }
  .sm-modos { display: inline-flex; margin-left: 8px; background: #222528; border: 1px solid var(--borda); border-radius: 9px; padding: 3px; gap: 2px; }
  .sm-modo { border: 0; background: none; color: var(--texto3); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .sm-modo:hover { color: var(--titulo); }
  .sm-modo[aria-pressed="true"] { background: var(--destaque); color: #1A1A1A; }
  .sm-cart-topo { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .sm-cart-linha { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .sm-cart-linha select { height: 40px; min-width: 220px; background: var(--card2); color: var(--titulo); border: 1px solid var(--borda-forte); border-radius: 8px; padding: 0 10px; font: inherit; }
  .sm-cart-escolha { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .sm-cart-escolha p { margin: 0; color: var(--texto3); font-size: 13px; }
  .sm-cart-escolha .sm-btn2 { height: auto; min-height: 34px; padding: 6px 12px; }
  .sm-cart-kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .sm-semaforo-txt { display: inline-flex; align-items: center; gap: 6px; }
  .sm-semaforo-txt i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
  .sm-semaforo-txt i:first-child { margin-left: 0; }
  .sm-sinal { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; color: var(--titulo); white-space: nowrap; }
  .sm-sinal i { width: 12px; height: 12px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cor) 25%, transparent); }
  .sm-sinal.s-cinza { color: var(--texto3); }
  .sm-cart-motivo { font-size: 11px; color: var(--texto3); margin-top: 3px; max-width: 220px; line-height: 1.35; }
  .sm-cart-sub { font-size: 11px; color: var(--texto3); margin-top: 2px; white-space: nowrap; }

  // ---------- utilidades ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];

  function rotulo(s) { return ROTULOS[s] || s || '(sem estado)'; }

  function textoErro(e) {
    if (!e) return 'erro desconhecido';

  function diasDesde(data) {

  function dataBR(v) {
    var t = Date.parse(v);
    if (isNaN(t)) return v || '';
    var d = new Date(t);
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function agora() {
    var d = new Date();
    function z(n) { return (n < 10 ? '0' : '') + n; }

  function anotar(etapa, situacao, detalhe) {

  function requisicao(metodo, url, corpo, ctxOutro, tempoMax) {
    return new Promise(function (resolve, reject) {
      var headers = { 'Accept': 'application/json' };
      if (ctxOutro || estado.ctx) headers['SecurityContext'] = ctxOutro || estado.ctx;
      if (corpo) headers['Content-Type'] = 'application/json';
      if (metodo !== 'GET' && estado.csrf) headers[estado.csrf.name] = estado.csrf.value;
      WAF.authenticatedRequest(url, {
        method: metodo, headers: headers, data: corpo ? JSON.stringify(corpo) : undefined, type: 'json', timeout: tempoMax || 180000,
        onComplete: function (r) { if (typeof r === 'string') { try { r = JSON.parse(r); } catch (x) { } } resolve(r); },
        onFailure: function (err, resp) {
          var extra = '';
          if (resp) { try { extra = ' | resposta: ' + (typeof resp === 'string' ? resp : JSON.stringify(resp)).slice(0, 500); } catch (x) { } }
          reject(new Error(textoErro(err) + extra));
        },
        onTimeout: function () { reject(new Error('tempo esgotado')); }
      });
    });
  }
  function comTempo(promessa, ms, nome) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error(nome + ': sem resposta em ' + (ms / 1000) + 's')); }, ms);
      promessa.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  // Chamada à busca da 3DX (3DSearch). Tenta formas diferentes e guarda a que funcionou.
  var FED_VARIANTES = [
    { nome: 'simples', ctx: false, extra: {} },
    { nome: 'passport', ctx: false, extra: { proxy: 'passport' } },
    { nome: 'com contexto', ctx: true, extra: {} }
  ];
  var fedVariante = -1;
  function chamarFed(url, corpo, v) {
    return new Promise(function (resolve, reject) {
      var headers = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
      if (v.ctx && estado.ctx) headers.SecurityContext = estado.ctx;
      var o = {
        method: 'POST', headers: headers, data: JSON.stringify(corpo), type: 'json', timeout: 30000,
        onComplete: function (r) { if (typeof r === 'string') { try { r = JSON.parse(r); } catch (x) { } } resolve(r); },
        onFailure: function (err, resp) {
          var extra = '';
          if (resp) { try { extra = ' | resposta: ' + (typeof resp === 'string' ? resp : JSON.stringify(resp)).slice(0, 300); } catch (x) { } }
          reject(new Error(textoErro(err) + extra));
        },
        onTimeout: function () { reject(new Error('tempo esgotado')); }
      };
      for (var k in v.extra) o[k] = v.extra[k];
      WAF.authenticatedRequest(url, o);
    });
  }
  function buscaFed(url, corpo) {
    if (fedVariante >= 0) return comTempo(chamarFed(url, corpo, FED_VARIANTES[fedVariante]), 35000, 'busca de imagens');
    amostra.thumbsTentativas = amostra.thumbsTentativas || [];
    var vazioValido = false;   // a busca respondeu certo, só não achou nada
    function tentar(i) {
      if (i >= FED_VARIANTES.length) {
        if (vazioValido) return Promise.resolve({ results: [] });
        return Promise.reject(new Error('nenhuma forma de chamar a busca de imagens funcionou'));
      }
      var v = FED_VARIANTES[i];
      return comTempo(chamarFed(url, corpo, v), 35000, v.nome).then(function (r) {
        if (r && !r.results && r.infos) {
          // a 3DX respondeu certo, só não achou nada: este jeito de chamar funciona
          amostra.thumbsTentativas.push(v.nome + ': 0 resultado(s)');
          fedVariante = i;
          return { results: [], vazio: true };
        }
        if (!r || !r.results) throw new Error('resposta sem "results": ' + String(JSON.stringify(r)).slice(0, 200));
        amostra.thumbsTentativas.push(v.nome + ': OK, ' + r.results.length + ' resultado(s)');
        fedVariante = i;
        return r;
      }).catch(function (e) {
        amostra.thumbsTentativas.push(v.nome + ': ' + textoErro(e));
        return tentar(i + 1);
      });
    }
    return tentar(0);
  }

  function lerSpaceDoLink() {

  function continuarConexao(endereco) {
    estado.spaceUrl = String(endereco).replace(/\/+$/, '');
    anotar('Usuário e contexto', '...');
    comTempo(requisicao('GET', estado.spaceUrl + '/resources/modeler/pno/person?current=true&select=preferredcredentials&select=collabspaces&select=firstname&select=lastname'), 30000, 'dados do usuário')
    .then(function (pessoa) {
      estado.pessoa = pessoa;
      var pc = pessoa && pessoa.preferredcredentials;
      if (pc && pc.role && pc.organization && pc.collabspace) {
        estado.ctx = 'ctx::' + pc.role.name + '.' + pc.organization.name + '.' + pc.collabspace.name;
      } else if (pessoa && pessoa.collabspaces && pessoa.collabspaces.length && pessoa.collabspaces[0].couples && pessoa.collabspaces[0].couples.length) {
        var cs = pessoa.collabspaces[0], c = cs.couples[0];
        estado.ctx = 'ctx::' + c.role.name + '.' + c.organization.name + '.' + cs.name;
      } else {
        throw new Error('não encontrei credenciais do usuário');
      }
      estado.usuario = pessoa.name || '';
      estado.nomeCompleto = [pessoa.firstname, pessoa.lastname].filter(Boolean).join(' ');
      anotar('Usuário e contexto', 'OK', estado.usuario + ' · ' + estado.ctx);
      anotar('Token CSRF', '...');
      return comTempo(requisicao('GET', estado.spaceUrl + '/resources/v1/application/CSRF'), 30000, 'token CSRF');
    }).then(function (r) {
      if (!r || !r.csrf || !r.csrf.name) throw new Error('resposta sem token');

      gravarLocal('sm-space', estado.spaceUrl);

      if (exato || membros.length === 1) { ler(exato || membros[0]); if (exato && exato.__outrasRev.length) setTimeout(function () { mostrarAviso('Abri a <strong>rev. ' + esc(exato.revision) + '</strong>, a mais recente. Também existe: rev. ' + esc(exato.__outrasRev.join(', rev. ')) + '.'); }, 0); return; }

  // compara revisões ("1.1" < "2.1", "A" < "B" < "AA", "A.1" < "A.2")
  function compararRev(a, b) {
    var pa = String(a || '').split(/[^0-9A-Za-z]+/), pb = String(b || '').split(/[^0-9A-Za-z]+/);
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var x = pa[i] || '', y = pb[i] || '';
      if (x === y) continue;
      var nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
      if (nx && ny) return Number(x) - Number(y);
      if (x.length !== y.length) return x.length - y.length;
      return x < y ? -1 : 1;
    }
    return 0;
  }
  // de vários itens com o mesmo nome (revisões), fica com a mais recente
  function maisRecente(lista) {
    return lista.slice().sort(function (a, b) {
      return compararRev(b.revision, a.revision) || (Date.parse(b.modified || 0) || 0) - (Date.parse(a.modified || 0) || 0);
    })[0];
  }
  function exatoMaisRecente(membros, termo) {
    var exatos = membros.filter(function (m) { return m.name === termo || m.title === termo; });
    if (!exatos.length) return null;
    // várias revisões do mesmo item: abre a mais recente
    var mesmoNome = exatos.filter(function (m) { return m.name === exatos[0].name; });
    var escolhido = maisRecente(mesmoNome.length > 1 ? mesmoNome : exatos);
    escolhido.__outrasRev = mesmoNome.filter(function (m) { return m !== escolhido; }).map(function (m) { return m.revision + ' ' + rotulo(m.state).toLowerCase(); });
    return escolhido;
  }

  function mostrarEscolha(membros) {

        '<strong>' + esc(m.title) + '</strong> · <span class="sm-mono">' + esc(m.name) + '</span> · rev. ' + esc(m.revision) +

    $('sm-conteudo').innerHTML = html;
  }

  function ler(raiz, vindoDaCarteira) {
    if (carteiraLendo) { mostrarAviso('Aguarde a carteira terminar de ler.', 'erro'); return; }
    deCarteira = !!vindoDaCarteira;
    trocarModo('montagem', true);
    $('sm-buscar').disabled = true;
    $('sm-atualizar').disabled = true;
    $('sm-conteudo').innerHTML = '<p class="sm-vazio">Lendo a estrutura de <strong>' + esc(raiz.title || raiz.name) + '</strong>. Em montagens grandes isso pode levar alguns segundos...</p>';
    anotar('Expansão', '...', (raiz.name || '') + ' "' + (raiz.title || '') + '"');
    requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/' + encodeURIComponent(raiz.id) + '/expand', { expandDepth: -1, withPath: true })
    .then(function (r) {
      var membros = (r && r.member) || [];
      corrigirEstadosMat(membros, raiz);
      bruto = { raiz: raiz, membros: membros, lido: agora() };
      aberto = {};
      thumbs = {}; thumbsEstado = ''; reservas = {}; revNovas = {}; extrasEstado = ''; filtro = null;
      desenhos = {}; desenhosEstado = ''; desenhosLista = {};
      processar();
      anotar('Expansão', 'OK', dados.unicos.length + ' itens únicos, ' + dados.nos.length + ' ocorrências');
      desenhar();
      var foto = bruto;
      Promise.all([carregarThumbs(), carregarDesenhos()]).then(function () { return conferirOutrosCS(foto); })
        .catch(function (e) { anotar('Outros espaços (CS)', 'ERRO', textoErro(e)); });
    }).catch(function (e) {
      anotar('Expansão', 'ERRO', textoErro(e));
      $('sm-conteudo').innerHTML = '';
      mostrarAviso('Não consegui ler a estrutura: ' + esc(textoErro(e)), 'erro');
    }).then(function () {
      $('sm-buscar').disabled = false;
      $('sm-atualizar').disabled = !bruto;
      $('sm-exportar').disabled = !dados; $('sm-relatorio').disabled = !dados; $('sm-pdfs').disabled = !dados; $('sm-maturidade').disabled = !dados || matRodando;
    });
  }

  // ---------- ler com todos os espaços de colaboração (CS) do usuário ----------
  // O contexto atual é só a "porta de entrada". Se algum CS for privado, os itens dele só aparecem
  // entrando por ele. Aqui o widget repete a leitura com um papel de cada um dos outros CS e junta tudo.
  function contextosOutrosCS() {
    var p = estado.pessoa || {}, por = {}, atualCS = String(estado.ctx || '').replace(/^ctx::/, '').split('.').slice(2).join('.');
    (p.collabspaces || []).forEach(function (cs) {
      (cs.couples || []).forEach(function (c) {
        if (!c.role || !c.organization) return;
        var peso = /Leader|Owner/i.test(c.role.name) ? 3 : /Admin/i.test(c.role.name) ? 2 : /Author|Contributor/i.test(c.role.name) ? 1 : 0;
        if (!por[cs.name] || peso > por[cs.name].peso) por[cs.name] = { ctx: 'ctx::' + c.role.name + '.' + c.organization.name + '.' + cs.name, peso: peso };
      });
    });
    return Object.keys(por).filter(function (n) { return n !== atualCS; }).map(function (n) { return { cs: n, ctx: por[n].ctx }; });
  }

  function emParalelo(lista, n, fazer) {
    var fila = lista.slice();
    function trab() { var x = fila.shift(); return x === undefined ? Promise.resolve() : Promise.resolve(fazer(x)).catch(function () { }).then(trab); }
    var t = []; for (var i = 0; i < n; i++) t.push(trab());
    return Promise.all(t);
  }

  function chaveMembro(m) { return m.type === 'Path' || m.Path ? 'P:' + (m.Path || []).join('/') : m.type + ':' + m.id; }

  // lê a estrutura com os outros CS e acrescenta em "membros" o que só eles enxergam
  function conferirEstruturaOutrosCS(raizId, membros) {
    var ctxs = contextosOutrosCS(), vistos = {}, res = { cs: ctxs.length, novosItens: 0, porCS: {}, falhas: 0 };
    membros.forEach(function (m) { vistos[chaveMembro(m)] = true; });
    if (!ctxs.length) return Promise.resolve(res);
    return emParalelo(ctxs, 4, function (c) {
      return requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/' + encodeURIComponent(raizId) + '/expand', { expandDepth: -1, withPath: true }, c.ctx, 90000)
        .then(function (r) {
          ((r && r.member) || []).forEach(function (m) {
            var k = chaveMembro(m);
            if (vistos[k]) return;
            vistos[k] = true; membros.push(m);
            if (m.type === 'VPMReference') { res.novosItens++; res.porCS[c.cs] = (res.porCS[c.cs] || 0) + 1; }
          });
        }).catch(function () { res.falhas++; });
    }).then(function () { return res; });
  }

  // procura desenhos de um item com um contexto; devolve a lista de ids
  function localizarDesenhosCom(it, temFilhos, ctx) {
    var PECA = 'resources/v1/modeler/dsxcad/dsxcad:Part/', ITEM = 'resources/v1/modeler/dseng/dseng:EngItem/';
    var tipos = temFilhos ? [ITEM, PECA] : [PECA, ITEM];
    function tentar(k) {
      if (k >= tipos.length) return Promise.resolve([]);
      return requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dsxcad/dsxcad:Drawing/Locate', {
        referencedObject: [{ source: '$3DSpace', type: 'VPMReference', id: it.id, relativePath: tipos[k] + it.id }]
      }, ctx, 20000).then(function (r) { return ((r && r.member) || []).map(function (d) { return d.id; }).filter(Boolean); })
        .catch(function () { return tentar(k + 1); });
    }
    return tentar(0);
  }

  function registrarDesenho(id, d) {
    if (d && !d.id) d.id = id;
    corrigirEstadosMat([d], null);
    ((d.relatedData || {}).member || []).forEach(function (l) {
      var alvo = l.referencedObject && l.referencedObject.id;
      if (!alvo) return;
      var atual = desenhos[alvo];
      if (!atual || (ORDEM_DES[d.state] || 0) > (ORDEM_DES[atual.state] || 0)) desenhos[alvo] = { state: d.state, name: d.name, title: d.title };
      var lista = desenhosLista[alvo] || (desenhosLista[alvo] = []);
      if (!lista.some(function (x) { return x.id === id; })) lista.push({ id: id, name: d.name, title: d.title, state: d.state, revision: d.revision, owner: d.owner, modified: d.modified, type: d.type || 'Drawing', collabspace: d.collabspace, organization: d.organization });
    });
  }

  // itens sem desenho: pergunta de novo com os outros CS (desenho pode estar num CS privado)
  function conferirDesenhosOutrosCS() {
    var ctxs = contextosOutrosCS(), res = { novos: 0, porCS: {} };
    if (!ctxs.length || !dados) return Promise.resolve(res);
    var temFilhos = {};
    dados.nos.forEach(function (n) { if (n.filhos.length) temFilhos[n.item.id] = true; });
    temFilhos[dados.raiz.item.id] = true;
    var sem = dados.unicos.map(function (u) { return u.item; }).concat([dados.raiz.item]).filter(function (it) { return !desenhos[it.id]; });
    var tarefas = [];
    sem.forEach(function (it) { ctxs.forEach(function (c) { tarefas.push({ it: it, c: c }); }); });
    // limite de segurança para estruturas muito grandes (cada consulta é uma chamada à 3DX)
    var LIMITE = 2000;
    if (tarefas.length > LIMITE) { res.limitado = tarefas.length; tarefas = tarefas.slice(0, LIMITE); }
    var vistos = {}, feitas = 0, inicio = Date.now(), PRAZO = 4 * 60000;
    Object.keys(desenhosLista).forEach(function (k) { desenhosLista[k].forEach(function (d) { vistos[d.id] = true; }); });
    var foto = bruto;
    return emParalelo(tarefas, 8, function (t) {
      if (bruto !== foto) return;                              // trocou de montagem: para
      if (Date.now() - inicio > PRAZO) { res.cortado = (res.cortado || 0) + 1; return; }
      feitas++;
      if (feitas % 25 === 0) anotar('Outros espaços (CS)', '...', 'conferindo desenhos em outros espaços: ' + feitas + ' de ' + tarefas.length + ' consulta(s)');
      if (desenhos[t.it.id]) return;   // outro CS já achou
      return localizarDesenhosCom(t.it, temFilhos[t.it.id], t.c.ctx).then(function (ids) {
        return Promise.all(ids.filter(function (id) { return !vistos[id]; }).map(function (id) {
          vistos[id] = true;
          return requisicao('GET', estado.spaceUrl + '/resources/v1/modeler/dsxcad/dsxcad:Drawing/' + encodeURIComponent(id) + '?$mask=dsmvxcad:xCADDrawingMask.Details', null, t.c.ctx)
            .then(function (r) { var d = r && r.member && r.member[0]; if (d) { registrarDesenho(id, d); res.novos++; res.porCS[t.c.cs] = (res.porCS[t.c.cs] || 0) + 1; } });
        }));
      });
    }).then(function () { res.consultas = tarefas.length; return res; });
  }

  // roda as duas conferências depois da leitura normal; "foto" garante que a montagem não mudou no meio
  function conferirOutrosCS(foto) {
    if (!cfg.todosCS || !bruto || !contextosOutrosCS().length) return Promise.resolve(false);
    var ctxs = contextosOutrosCS();
    anotar('Outros espaços (CS)', '...', 'relendo a estrutura com ' + ctxs.length + ' outro(s) espaço(s) de colaboração: ' + ctxs.map(function (c) { return c.cs; }).join(', '));
    return conferirEstruturaOutrosCS(foto.raiz.id, foto.membros).then(function (rE) {
      if (bruto !== foto) return false;
      var mudou = rE.novosItens > 0;
      if (mudou) { processar(); }
      return (mudou ? Promise.all([carregarThumbs(), carregarDesenhos()]) : Promise.resolve()).then(function () {
        if (bruto !== foto) return false;
        return conferirDesenhosOutrosCS().then(function (rD) {
          if (bruto !== foto) return false;
          var txt = ctxs.length + ' CS conferido(s) · ' + rE.novosItens + ' item(ns) só visto(s) por outro CS' +
            (rE.novosItens ? ' (' + Object.keys(rE.porCS).map(function (k) { return k + ': ' + rE.porCS[k]; }).join(', ') + ')' : '') +
            ' · ' + rD.novos + ' desenho(s) a mais' + (rD.novos ? ' (' + Object.keys(rD.porCS).map(function (k) { return k + ': ' + rD.porCS[k]; }).join(', ') + ')' : '') +
            (rE.falhas ? ' · ' + rE.falhas + ' CS sem acesso à montagem' : '') +
            (rD.limitado ? ' · desenhos conferidos só em parte (' + rD.limitado + ' consultas, limite 2000)' : '') +
            (rD.cortado ? ' · prazo de 4 min esgotado: ' + rD.cortado + ' consulta(s) de desenho não feitas' : '');
          anotar('Outros espaços (CS)', (rD.cortado || rD.limitado) ? 'PARCIAL' : 'OK', txt);
          amostra.outrosCS = { estrutura: rE, desenhos: rD };
          if (mudou || rD.novos) {
            desenhar();
            if (mudou) mostrarAviso('Encontrei <strong>' + rE.novosItens + ' item(ns)</strong> que só aparecem por outro espaço de colaboração (' + esc(Object.keys(rE.porCS).join(', ')) + '). Já estão incluídos.');
          }
          return mudou || rD.novos > 0;
        });
      });
    });
  }

  // ---------- carteira ----------
  function lerCarteiras() {
    var c = null;
    try { c = JSON.parse(lerLocal('sm-carteiras') || 'null'); } catch (x) { c = null; }
    if (!c || !c.listas) c = { atual: 'Minha carteira', listas: { 'Minha carteira': [] } };
    if (!c.listas[c.atual]) c.atual = Object.keys(c.listas)[0] || 'Minha carteira';
    if (!c.listas[c.atual]) c.listas[c.atual] = [];
    carteiras = c;
  }
  function gravarCarteiras() { gravarLocal('sm-carteiras', JSON.stringify(carteiras)); }
  function listaAtual() { return carteiras.listas[carteiras.atual] || []; }

  function trocarModo(m, semDesenhar) {
    modo = m;
    $('sm-modo-montagem').setAttribute('aria-pressed', m === 'montagem' ? 'true' : 'false');
    $('sm-modo-carteira').setAttribute('aria-pressed', m === 'carteira' ? 'true' : 'false');
    $('sm-exportar').disabled = m === 'carteira' ? !listaAtual().some(function (x) { return carteiraDados[x.id] && carteiraDados[x.id].resumo; }) : !dados;
    $('sm-relatorio').disabled = $('sm-exportar').disabled;
    $('sm-pdfs').disabled = m === 'carteira' || !dados;
    $('sm-maturidade').disabled = m === 'carteira' || !dados || matRodando;
    $('sm-atualizar').disabled = m === 'carteira' ? !listaAtual().length : !bruto;
    if (semDesenhar) return;
    if (m === 'carteira') { desenharCarteira(); if (listaAtual().length && listaAtual().some(function (x) { return !carteiraDados[x.id]; })) lerCarteira(false); }
    else if (dados) desenhar();
    else $('sm-conteudo').innerHTML = '<div class="sm-inicio"><strong>Nenhuma montagem carregada</strong>Busque uma montagem pelo nome ou título, ou arraste uma montagem da 3DX para cá.</div>';
  }

  // guarda e restaura o estado de uma montagem lida
  function fotografar() {
    return { bruto: bruto, dados: dados, thumbs: thumbs, thumbsEstado: thumbsEstado, desenhos: desenhos, desenhosEstado: desenhosEstado,
      desenhosLista: desenhosLista, reservas: reservas, revNovas: revNovas, extrasEstado: extrasEstado };
  }
  function restaurar(f) {
    bruto = f.bruto; dados = f.dados; thumbs = f.thumbs; thumbsEstado = f.thumbsEstado; desenhos = f.desenhos; desenhosEstado = f.desenhosEstado;
    desenhosLista = f.desenhosLista; reservas = f.reservas; revNovas = f.revNovas; extrasEstado = f.extrasEstado;
    aberto = {}; filtro = null;
  }

  // resumo de uma montagem (usa o estado global já restaurado)
  function resumirMontagem() {
    var d = dados, total = d.unicos.length;
    var lib = d.porEstado.RELEASED || 0;
    var rd = resumoDesenhos(), acao = listaAcao();
    var semDesLib = acao.filter(function (e) { return e.semDes; }).length;
    var res = itensDoFiltro('kpi:reservados'), resPar = res.filter(function (e) { return e.parado; }).length;
    var r = {
      total: total, lib: lib, pctLib: pct(lib, total), naoLib: d.unicos.filter(function (u) { return u.item.state !== 'RELEASED' && u.item.state !== 'OBSOLETE'; }).length,
      desTotal: rd.base, desLib: rd.lib, desFaltam: rd.faltam, desSem: rd.sem, pctDes: rd.pct, desOk: desenhosEstado === 'ok',
      parados: d.parados, paiLib: d.paiLib, semDesLib: semDesLib, reservados: res.length, resPar: resPar,
      revisao: itensDoFiltro('kpi:revisao').length, minhas: itensDoFiltro('kpi:minhas').length, acao: acao.length, thumb: thumbs[d.raiz.item.name] || '', raiz: d.raiz.item
    };
    // Crítico: só inconsistência de verdade. Atenção: pendências normais de andamento.
    var criticos = [], atencao = [];
    if (r.paiLib) criticos.push(r.paiLib + ' pendente(s) sob pai liberado');
    if (r.resPar) criticos.push(r.resPar + ' reservado(s) e parado(s)');
    if (r.semDesLib) atencao.push(r.semDesLib + ' liberado(s) sem desenho liberado');
    if (r.pctLib < cfg.metaPct) atencao.push(r.pctLib + '% liberado (meta ' + cfg.metaPct + '%)');
    if (r.desOk && r.pctDes < cfg.metaPct) atencao.push(r.pctDes + '% dos desenhos liberados');
    if (r.parados) atencao.push(r.parados + ' parado(s)');
    if (criticos.length) { r.sinal = 'vermelho'; r.motivo = criticos.concat(atencao).join(' · '); }
    else if (atencao.length) { r.sinal = 'amarelo'; r.motivo = atencao.join(' · '); }
    else { r.sinal = 'verde'; r.motivo = 'dentro da meta de ' + cfg.metaPct + '%, sem pendências'; }
    return r;
  }

  // refaz o semáforo de cada montagem da carteira (ex.: depois de mudar as configurações)
  function recalcularCarteira() {
    if (carteiraLendo) return;
    var ids = Object.keys(carteiraDados).filter(function (k) { return carteiraDados[k].foto; });
    if (!ids.length) return;
    var atual = dados ? fotografar() : null, ab = aberto, fi = filtro;
    ids.forEach(function (k) { restaurar(carteiraDados[k].foto); carteiraDados[k].resumo = resumirMontagem(); });
    if (atual) { restaurar(atual); aberto = ab; filtro = fi; } else { dados = null; bruto = null; }
  }

  // lê uma montagem inteira sem mexer na tela
  function lerMontagemSilenciosa(raiz) {
    return requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/' + encodeURIComponent(raiz.id) + '/expand', { expandDepth: -1, withPath: true })
      .then(function (r) {
        bruto = { raiz: raiz, membros: (r && r.member) || [], lido: agora() };
        thumbs = {}; thumbsEstado = ''; reservas = {}; revNovas = {}; extrasEstado = '';
        desenhos = {}; desenhosEstado = ''; desenhosLista = {};
        processar();
        var foto = bruto;
        return Promise.all([carregarThumbs(), carregarDesenhos()]).then(function () { return conferirOutrosCS(foto).catch(function () { }); });
      });
  }

  function lerCarteira(tudo) {
    if (carteiraLendo || !conectado) return;
    var lista = listaAtual().filter(function (x) { return tudo || !carteiraDados[x.id]; });
    if (!lista.length) { desenharCarteira(); return; }
    var antes = dados ? fotografar() : null;
    $('sm-buscar').disabled = true; $('sm-atualizar').disabled = true;
    anotar('Carteira', '...', lista.length + ' montagem(ns)');
    lista.reduce(function (p, raiz, i) {
      return p.then(function () {
        carteiraLendo = { i: i + 1, total: lista.length, nome: raiz.title || raiz.name };
        desenharProgresso();
        return lerMontagemSilenciosa(raiz).then(function () {
          carteiraDados[raiz.id] = { foto: fotografar(), resumo: resumirMontagem(), lido: agora() };
        }).catch(function (e) { carteiraDados[raiz.id] = { erro: textoErro(e) }; });
      });
    }, Promise.resolve()).then(function () {
      carteiraLendo = null;
      if (antes) restaurar(antes); else { dados = null; bruto = null; }
      anotar('Carteira', 'OK', lista.length + ' montagem(ns) lida(s)');
      $('sm-buscar').disabled = false;
      trocarModo(modo, true);
      desenhar();
    });
  }

  function desenharProgresso() {
    if (modo !== 'carteira' || !carteiraLendo) return;
    var c = carteiraLendo;
    $('sm-conteudo').innerHTML = '<div class="sm-caixa sm-progresso"><strong>Lendo a carteira: ' + c.i + ' de ' + c.total + '</strong>' +
      '<span>' + esc(c.nome) + '</span><div class="sm-barra-prog"><i style="width:' + pct(c.i - 1, c.total) + '%"></i></div>' +
      '<p class="sm-nota">Cada montagem é lida por completo (estrutura, desenhos, reservas e revisões). Montagens grandes levam mais tempo.</p></div>';
  }

  var COR_SINAL = { verde: '#0ca30c', amarelo: '#F5C75A', vermelho: '#E05252' };
  var NOME_SINAL = { verde: 'No prazo', amarelo: 'Atenção', vermelho: 'Crítico' };

  function desenharCarteira() {
    var lista = listaAtual();
    var html = '<div class="sm-caixa sm-cart-topo">' +
      '<div class="sm-cart-linha"><label class="sm-campo" for="sm-cart-sel">Carteira<select id="sm-cart-sel">' +

      '</select></label>' +
      '<button type="button" class="sm-btn2" id="sm-cart-nova">Nova carteira</button>' +
      '<button type="button" class="sm-btn2" id="sm-cart-renomear">Renomear</button>' +
      '<button type="button" class="sm-btn2" id="sm-cart-excluir">Excluir</button></div>' +
      '<div class="sm-cart-linha"><div class="sm-busca" style="flex:1 1 260px">' + ICONE_BUSCA + '<input id="sm-cart-nome" type="text" placeholder="Adicionar montagem: nome ou título" aria-label="Adicionar montagem à carteira" /></div>' +
      '<button type="button" class="sm-btn" id="sm-cart-add"' + (conectado ? '' : ' disabled') + '>Adicionar</button></div>' +
      (carteiraBusca.length ? '<div class="sm-cart-escolha"><p>Encontrei ' + carteiraBusca.length + ' itens. Qual adicionar?</p>' + carteiraBusca.map(function (m, i) {
        return '<button type="button" class="sm-btn2 sm-cart-pega" data-i="' + i + '"><strong>' + esc(m.title) + '</strong>&nbsp;· rev. ' + esc(m.revision) + ' · ' + esc(rotulo(m.state)) + '</button>';
      }).join('') + '<button type="button" class="sm-btn2" id="sm-cart-cancela">Cancelar</button></div>' : '') +
      '</div>';

    if (!lista.length) {
      $('sm-conteudo').innerHTML = html + '<div class="sm-inicio"><strong>Carteira vazia</strong>Adicione as montagens que você quer acompanhar juntas (pela busca ou arrastando da 3DX). A lista fica salva neste navegador.</div>';
      return;
    }
    var res = lista.map(function (m) { return { m: m, c: carteiraDados[m.id] }; });
    var ok = res.filter(function (x) { return x.c && x.c.resumo; });
    var t = { total: 0, lib: 0, desTotal: 0, desLib: 0, parados: 0, reservados: 0, revisao: 0, acao: 0, minhas: 0, verde: 0, amarelo: 0, vermelho: 0 };
    ok.forEach(function (x) { var r = x.c.resumo; ['total', 'lib', 'desTotal', 'desLib', 'parados', 'reservados', 'revisao', 'acao', 'minhas'].forEach(function (k) { t[k] += r[k] || 0; }); t[r.sinal]++; });

    html += '<div class="sm-kpis sm-cart-kpis">' +
      kpiC('Montagens', lista.length, ok.length < lista.length ? (lista.length - ok.length) + ' sem leitura' : 'na carteira', '') +

  function contarMat(c, tipo) { return matPlano.lista.filter(function (o) { return o.classe === c && (!tipo || (tipo === 'Drawing') === (o.tipo === 'Drawing')); }).length; }

  function mostrarSimulacao() {

  function csvMat(nomeBase) {

  function executarMaturidade() {
    var p = matPlano;
    if (!p || matRodando) return;
    var fila = p.lista.filter(function (o) { return o.classe === 'muda'; });
    if (!fila.length) return;

    var niveis = {}, total = fila.length, feitos = 0, ok = 0, url = estado.spaceUrl + '/resources/v1/modeler/dslc/maturity/changeState';
    fila.forEach(function (o) { o.estadoAntes = o.estado; (niveis[o.nivel] = niveis[o.nivel] || []).push(o); });
    var ordem = Object.keys(niveis).map(Number).sort(function (a, b) { return b - a; });
    iniciarPainel(ordem.length, 'Mudando maturidade para ' + rotulo(p.op.alvo));
    anotar('Maturidade em lote', '...', 'mudando ' + total + ' objeto(s) → ' + p.op.alvo);
    function prog(k, nv) { painelPdf(k + 1, 'Nível ' + nv + (nv === 0 ? ' (montagem pai)' : ''), feitos, total, ok + ' mudado(s)' + (feitos - ok ? ', ' + (feitos - ok) + ' com falha' : '')); }

      return requisicao('POST', url, { data: lote.map(function (o) { var r = refMat(o); r.nextState = p.op.alvo; return r; }) }, lote[0].ctx, 120000).then(function (r) {
        var porId = {};
        ((r && (r.results || r.data)) || []).forEach(function (x) { if (x && x.id) porId[x.id] = x; });
        lote.forEach(function (o) {
          var x = porId[o.id];
          if (x && x.maturityState === p.op.alvo) { o.feito = true; o.estado = p.op.alvo; ok++; matAplicado[o.id] = { estado: p.op.alvo, antes: o.estadoAntes, quando: Date.now() }; }
          else if (x && x.maturityState) o.falha = 'ficou ' + rotulo(x.maturityState);
          else if (lote.length === 1 && r && r.status && r.status.code === 0) { o.feito = true; o.estado = p.op.alvo; ok++; matAplicado[o.id] = { estado: p.op.alvo, antes: o.estadoAntes, quando: Date.now() }; }
          else o.falha = 'a 3DX não confirmou';
        });
        feitos += lote.length;
      }).catch(function (e) {

        var objs = niveis[nv], lotes = [];
        // item e seus desenhos no mesmo lote
        objs.sort(function (a, b) { return String(a.ctx).localeCompare(String(b.ctx)) || String(a.item.id).localeCompare(String(b.item.id)) || (a.tipo === 'Drawing' ? 1 : -1); });

        if (atual.length) lotes.push(atual);

      });
    }, Promise.resolve()).then(function () {
      fecharPainel();
      var falhas = fila.filter(function (o) { return !o.feito; });
      anotar('Maturidade em lote', falhas.length ? (ok ? 'OK' : 'ERRO') : 'OK', ok + ' de ' + total + ' mudado(s) para ' + p.op.alvo + (falhas.length ? '; falhas: ' + falhas.slice(0, 5).map(function (o) { return o.nome + ' (' + o.falha + ')'; }).join('; ') : ''));
      amostra.maturidade = { alvo: p.op.alvo, total: total, ok: ok, falhas: falhas.map(function (o) { return { nome: o.nome, tipo: o.tipo, erro: o.falha }; }) };
      mostrarAviso('<strong>Maturidade em lote:</strong> ' + ok + ' de ' + total + ' objeto(s) foram para <strong>' + rotulo(p.op.alvo) + '</strong>.' +
        (falhas.length ? ' <strong>' + falhas.length + ' falharam</strong>: ' + falhas.slice(0, 4).map(function (o) { return esc(o.nome) + ' (' + esc(o.falha) + ')'; }).join('; ') + (falhas.length > 4 ? '...' : '') : '') +

  // ---------- painel de andamento da exportação ----------
  var pdfUi = { inicio: 0, etapas: 2, pararEspera: false, relogio: null, ultimo: null };
  function painelPdf(etapa, titulo, atual, total, detalhe, podeParar) {
    pdfUi.ultimo = [etapa, titulo, atual, total, detalhe, podeParar];
    var seg = Math.round((Date.now() - pdfUi.inicio) / 1000), tempo = seg >= 60 ? Math.floor(seg / 60) + 'min ' + (seg % 60) + 's' : seg + 's';
    var p = total ? Math.min(100, Math.round(100 * atual / total)) : 0;
    $('sm-aviso').innerHTML = '<div class="sm-aviso sm-prog-pdf" role="status" aria-live="polite">' +

      '<div class="sm-prog-etapa">Etapa ' + etapa + ' de ' + pdfUi.etapas + ' · ' + esc(titulo) + (total ? ' — <strong>' + atual + ' de ' + total + '</strong>' : '') + '</div>' +

  function iniciarPainel(etapas, titulo) {

  }
  function fecharPainel() { clearInterval(pdfUi.relogio); pdfUi.relogio = null; pdfUi.ultimo = null; }

  // pede à 3DX para gerar os PDFs (em lotes) e espera ficarem prontos
  function gerarPdfs(lista) {
    var N = lista.length;
    painelPdf(2, 'Pedindo à 3DX para gerar ' + N + ' PDF(s)', 0, N, 'procurando a regra de conversão de desenho para PDF...');
    return acharRegraPdf().then(function (regra) {
      if (!regra) throw new Error('este tenant não tem regra de conversão sob demanda de desenho para PDF (Derived Format Converter)');
      var lotes = [], enviados = 0;
      for (var i = 0; i < N; i += 25) lotes.push(lista.slice(i, i + 25));
      painelPdf(2, 'Pedindo à 3DX para gerar ' + N + ' PDF(s)', 0, N, 'enviando os pedidos de conversão...');
      return lotes.reduce(function (pr, lote) {
        return pr.then(function () {
          var corpo = { conversionRequests: lote.map(function (x) {
            return { referencedObject: { source: '$3DSpace', type: 'Drawing', id: x.d.id, relativePath: 'resources/v1/modeler/dsxcad/dsxcad:Drawing/' + x.d.id }, ruleID: regra.ruleId };
          }) };
          return comContextoExport(function (c) {
            return requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dsdo/dsdo:DerivedOutputJobs', corpo, c);
          }).then(function () { enviados += lote.length; painelPdf(2, 'Pedindo à 3DX para gerar ' + N + ' PDF(s)', enviados, N, 'pedidos enviados'); });
        });
      }, Promise.resolve());
    }).then(function () {
      anotar('Gerar PDFs', 'OK', N + ' conversão(ões) pedida(s)');
      // tempo máximo proporcional à quantidade (mín. 5 min, máx. 20 min); para antes se nada ficar pronto por 3 min
      var limite = Math.min(20 * 60000, Math.max(5 * 60000, N * 6000)), inicio = Date.now(), ultimoAvanco = Date.now();
      var pendentes = lista.slice(), prontos = 0;
      function mostrar() {
        painelPdf(3, 'A 3DX está gerando os PDFs', prontos, N, 'Pedidos enviados. A conversão roda na 3DX e pode levar alguns minutos; o widget confere a cada poucos segundos (limite ' + Math.round(limite / 60000) + ' min).', true);
      }
      function rodada() {
        mostrar();
        return emParalelo(pendentes, 8, function (x) {
          return lerSaidas(x.d).then(function (arqs) { var f = escolherPdf(arqs); if (f) { x.pdf = f; x.gerado = true; } });
        }).then(function () {
          var antes = prontos;
          pendentes = pendentes.filter(function (x) { return !x.pdf; });
          prontos = N - pendentes.length;
          if (prontos > antes) ultimoAvanco = Date.now();
          mostrar();
          if (!pendentes.length || pdfUi.pararEspera || Date.now() - inicio > limite || Date.now() - ultimoAvanco > 180000) return;
          return esperar(8000).then(rodada);
        });
      }
      function esperar(ms) {
        return new Promise(function (ok) {
          var t0 = Date.now(), iv = setInterval(function () { if (pdfUi.pararEspera || Date.now() - t0 >= ms) { clearInterval(iv); ok(); } }, 250);
        });
      }
      return esperar(4000).then(rodada).then(function () {
        pendentes.forEach(function (x) { x.emConversao = true; });
        anotar('Gerar PDFs', 'OK', prontos + ' de ' + N + ' pronto(s)' + (pendentes.length ? ', ' + pendentes.length + ' ainda em conversão' : ''));
      });
    });
  }

  var exportPendente = null;   // desenhos analisados esperando o usuário decidir sobre os sem PDF

  function exportarPdfs() {
    if (pdfsRodando) return;
    if (!dados || desenhosEstado !== 'ok') { mostrarAviso('Carregue uma montagem e aguarde os desenhos serem consultados.', 'erro'); return; }

    dados.unicos.forEach(function (u) { naEstrutura[u.item.id] = true; }); naEstrutura[dados.raiz.item.id] = true;
    Object.keys(desenhosLista).filter(function (itemId) { return naEstrutura[itemId]; }).forEach(function (itemId) {
      (desenhosLista[itemId] || []).forEach(function (d) { if (!vistos[d.id]) { vistos[d.id] = true; desenhosEst.push(d); } });
    });
    if (!desenhosEst.length) { mostrarAviso('Nenhum desenho encontrado nesta estrutura.', 'erro'); return; }
    pdfsRodando = true; $('sm-pdfs').disabled = true;
    var total = desenhosEst.length, vistosN = 0;

    var itens = desenhosEst.map(function (d) { return { d: d }; });
    emParalelo(itens, 6, function (x) {

        .then(function () { vistosN++; painelPdf(1, 'Verificando quais desenhos já têm PDF', vistosN, total, 'consultando as saídas derivadas na 3DX...'); });
    }).then(function () {
      var semPdf = itens.filter(function (x) { return !x.pdf && !x.erro; });
      if (!semPdf.length) { pdfUi.etapas = 2; return concluirPdfs(itens, 2); }
      // pergunta antes de gerar
      fecharPainel();
      exportPendente = { itens: itens, semPdf: semPdf };
      mostrarAviso('<strong>PDFs dos desenhos:</strong> ' + (total - semPdf.length) + ' de ' + total + ' desenho(s) já têm PDF. <strong>' + semPdf.length + (semPdf.length === 1 ? ' não tem.' : ' não têm.') + '</strong> ' +
        '<span class="sm-acoes-aviso"><button type="button" class="sm-btn" id="sm-pdf-gerar">' + (semPdf.length === 1 ? 'Gerar o PDF que falta e baixar tudo' : 'Gerar os ' + semPdf.length + ' PDFs que faltam e baixar tudo') + '</button>' +
        '<button type="button" class="sm-btn2" id="sm-pdf-so">Baixar só os que existem</button></span>');

  function decidirPdfs(gerar) {

    var passo = gerar ? gerarPdfs(p.semPdf).catch(function (e) { p.erroGerar = textoErro(e); anotar('Gerar PDFs', 'ERRO', textoErro(e)); }) : Promise.resolve();

  function falhaPdfs(e) {

  function concluirPdfs(itens, etapaBaixar, erroGerar) {
    var raiz = dados.raiz.item, comPdf = itens.filter(function (x) { return x.pdf; }), feitos = 0;
    var incluidos = [], falhas = [], nomesUsados = {}, fila = comPdf.slice();
    function proximo() {
      var x = fila.shift(); if (!x) return Promise.resolve();

      itens.forEach(function (x) { corpo += '<div class="mont">' + x.secao + '</div>'; });
      abrirRelatorio(rPagina('Relatório da carteira', carteiras.atual, corpo), 'relatorio-carteira-' + carteiras.atual.replace(/[^\w-]+/g, '_'));
      return;
    }
    if (!dados) { mostrarAviso('Busque uma montagem antes de gerar o relatório.', 'erro'); return; }
    var r = dados.raiz.item;
    abrirRelatorio(rPagina('Relatório de status da montagem', r.title || r.name, rSecoesMontagem(false)), 'relatorio-' + String(r.title || r.name).replace(/[^\w-]+/g, '_'));
