  // ---------- thumbnails (via 3DSearch, que devolve o preview_url de cada item) ----------
  function carregarThumbs() {
    if (!dados) return;
    var m = /^(https:\/\/)([a-z0-9]+)(-[a-z0-9]+)-space\.(.*?)\/enovia/i.exec(estado.spaceUrl || '');
    if (!m) { thumbsEstado = 'erro'; anotar('Thumbnails', 'ERRO', 'não reconheci o endereço do 3DSpace'); desenharArvore(); return; }
    var tenant = m[2].toUpperCase();
    var urlBusca = m[1] + m[2] + m[3] + '-fedsearch.' + m[4] + '/federated/search?xrequestedwith=xmlhttprequest&tenant=' + tenant;
    var nomes = [];
    dados.unicos.forEach(function (u) { if (u.item.name && !(u.item.name in thumbs)) nomes.push(u.item.name); });
    if (dados.raiz.item.name && !(dados.raiz.item.name in thumbs)) nomes.push(dados.raiz.item.name);
    if (!nomes.length) { thumbsEstado = 'ok'; extrasEstado = 'ok'; desenharArvore(); return; }
    thumbsEstado = 'carregando'; extrasEstado = 'carregando';
    anotar('Thumbnails', '...', nomes.length + ' itens');
    var idsEstrutura = {};
    dados.unicos.forEach(function (u) { idsEstrutura[u.item.id] = true; });
    idsEstrutura[dados.raiz.item.id] = true;
    var exato = {}, pendRev = {}, ultimas = {};
    function attr(a, k) { for (var n in a) { if (n === k || n.split('/').pop() === k) return a[n]; } return undefined; }
    var lotes = [];
    for (var i = 0; i < nomes.length; i += 25) lotes.push(nomes.slice(i, i + 25));
    var falhas = 0;
    function processarLote(lote) {
      var corpo = {
        label: 'sm-thumbs', locale: 'en', select_predicate: ['ds6w:identifier', 'preview_url', 'physicalid', 'ds6w:reserved', 'ds6w:reservedBy', 'ds6w:isLastRevision', 'ds6w:status'],
        with_indexing_date: false, with_nls: false, with_synthesis: false,
        query: lote.join(' OR '), refine: {}, order_by: 'desc', order_field: 'relevance',
        nresults: 100, start: '0', source: ['3dspace'], tenant: tenant,
        login: { '3dspace': { SecurityContext: estado.ctx } }
      };
      return buscaFed(urlBusca, corpo).then(function (r) {
        if (!amostra.thumbsAmostra && r && r.results && r.results[0]) {
          amostra.thumbsAmostra = (r.results[0].attributes || []).map(function (x) { return x.name; });
        }
        (r && r.results || []).forEach(function (res) {
          var a = {};
          (res.attributes || []).forEach(function (x) { a[x.name] = x.value; });
          var id = a['ds6w:identifier'], pid = a.physicalid;
          if (!id || lote.indexOf(id) < 0) return;
          if (pid && idsEstrutura[pid]) {
            // é exatamente a revisão que está na estrutura
            if (a.preview_url) { thumbs[id] = a.preview_url; exato[id] = true; }
            if (String(attr(a, 'ds6w:reserved')).toUpperCase() === 'TRUE') reservas[pid] = { por: attr(a, 'ds6w:reservedBy') || '' };
            if (String(attr(a, 'ds6w:isLastRevision')) === 'false') pendRev[id] = pid;
          } else {
            // outra revisão do mesmo item
            if (a.preview_url && !exato[id] && !thumbs[id]) thumbs[id] = a.preview_url;
            if (String(attr(a, 'ds6w:isLastRevision')) === 'true' && pid) ultimas[id] = { pid: pid, reservado: String(attr(a, 'ds6w:reserved')).toUpperCase() === 'TRUE', por: attr(a, 'ds6w:reservedBy') || '' };
          }
        });
        lote.forEach(function (n) { if (!(n in thumbs)) thumbs[n] = ''; });
      }).catch(function (e) { falhas++; amostra.erroThumbs = textoErro(e); });
    }
    // o primeiro lote descobre a forma de chamada que funciona; os demais vão em paralelo
    processarLote(lotes[0]).then(function () {
      return Promise.all(lotes.slice(1).map(processarLote));
    }).then(function () {
      thumbsEstado = falhas === lotes.length ? 'erro' : 'ok';
      anotar('Thumbnails', falhas ? (falhas === lotes.length ? 'ERRO' : 'OK') : 'OK', falhas ? falhas + ' de ' + lotes.length + ' lote(s) falharam' : '');
      desenhar();
      // revisões mais novas: busca revisão, estado e owner de cada uma
      var pend = Object.keys(pendRev).filter(function (n) { return ultimas[n]; });
      return Promise.all(pend.map(function (n) {
        var u = ultimas[n];
        return requisicao('GET', estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/' + encodeURIComponent(u.pid)).then(function (r) {
          var m = r && r.member && r.member[0];
          if (m) revNovas[pendRev[n]] = { id: u.pid, revision: m.revision, state: m.state, owner: m.owner, modified: m.modified, reservado: u.reservado, por: u.por };
        }).catch(function (e) { amostra.erroRevisao = textoErro(e); });
      })).then(function () {
        extrasEstado = falhas === lotes.length ? 'erro' : 'ok';
        anotar('Reservas e revisões', extrasEstado === 'ok' ? 'OK' : 'ERRO', Object.keys(reservas).length + ' reservado(s) · ' + Object.keys(revNovas).length + ' com revisão nova');
        desenhar();
      });
    });
  }

  // ---------- desenhos ----------
  // 1) a busca da 3DX acha os desenhos (tipo Drawing) cujo rótulo é o título-base das peças;
  // 2) o detalhe de cada desenho (API de CAD) diz exatamente qual item ele detalha.
  var ORDEM_DES = { RELEASED: 3, FROZEN: 2, IN_WORK: 1, PRIVATE: 0 };

  function tituloBase(t) { return String(t || '').replace(/\s*\([^()]*\)\s*$/, '').trim(); }

  function infoFed() {
    var m = /^(https:\/\/)([a-z0-9]+)(-[a-z0-9]+)-space\.(.*?)\/enovia/i.exec(estado.spaceUrl || '');
    if (!m) return null;
    var tenant = m[2].toUpperCase();
    return { tenant: tenant, url: m[1] + m[2] + m[3] + '-fedsearch.' + m[4] + '/federated/search?xrequestedwith=xmlhttprequest&tenant=' + tenant };
  }

  function carregarDesenhos() {
    if (!dados) return;
    var f = infoFed();
    if (!f) { desenhosEstado = 'erro'; anotar('Desenhos', 'ERRO', 'não reconheci o endereço do 3DSpace'); desenhar(); return; }
    var itens = dados.unicos.map(function (u) { return u.item; }).concat([dados.raiz.item]);
    var rotulos = [];
    itens.forEach(function (it) { var b = tituloBase(it.title || it.name).replace(/"/g, ''); if (b && rotulos.indexOf(b) < 0) rotulos.push(b); });
    desenhosEstado = 'carregando';
    anotar('Desenhos', '...', rotulos.length + ' títulos');
    var lotes = [];
    for (var i = 0; i < rotulos.length; i += 20) lotes.push(rotulos.slice(i, i + 20));
    var achados = {}, falhas = 0;
    function buscarLote(lote) {
      var corpo = {
        label: 'sm-desenhos', locale: 'en', select_predicate: ['ds6w:identifier', 'physicalid'],
        with_indexing_date: false, with_nls: false, with_synthesis: false,
        query: '[ds6w:type]:"Drawing" AND (' + lote.map(function (l) { return '[ds6w:label]:"' + l + '"'; }).join(' OR ') + ')',
        refine: {}, order_by: 'desc', order_field: 'relevance', nresults: 200, start: '0', source: ['3dspace'], tenant: f.tenant,
        login: { '3dspace': { SecurityContext: estado.ctx } }
      };
      return buscaFed(f.url, corpo).then(function (r) {
        (r && r.results || []).forEach(function (res) {
          var a = {};
          (res.attributes || []).forEach(function (x) { a[x.name] = x.value; });
          if (a.physicalid) achados[a.physicalid] = a['ds6w:identifier'] || '';
        });
      }).catch(function (e) { falhas++; amostra.erroDesenhos = textoErro(e); });
    }
    function detalhar(id) {
      return requisicao('GET', estado.spaceUrl + '/resources/v1/modeler/dsxcad/dsxcad:Drawing/' + encodeURIComponent(id) + '?$mask=dsmvxcad:xCADDrawingMask.Details')
        .then(function (r) {
          var d = r && r.member && r.member[0];
          if (!d) return;
          ((d.relatedData || {}).member || []).forEach(function (l) {
            var alvo = l.referencedObject && l.referencedObject.id;
            if (!alvo) return;
            var atual = desenhos[alvo];
            if (!atual || (ORDEM_DES[d.state] || 0) > (ORDEM_DES[atual.state] || 0)) desenhos[alvo] = { state: d.state, name: d.name, title: d.title };
            var lista = desenhosLista[alvo] || (desenhosLista[alvo] = []);
            if (!lista.some(function (x) { return x.id === id; })) {
              lista.push({ id: id, name: d.name, title: d.title, state: d.state, revision: d.revision, owner: d.owner, modified: d.modified, type: d.type || 'Drawing' });
            }
          });
        }).catch(function (e) { falhas++; amostra.erroDesenhoDetalhe = textoErro(e); });
    }
    var cadeia = lotes.length ? buscarLote(lotes[0]).then(function () { return Promise.all(lotes.slice(1).map(buscarLote)); }) : Promise.resolve();
    cadeia.then(function () {
      var ids = Object.keys(achados);
      amostra.desenhosAchados = ids.length;
      // detalha de 6 em 6 para não sobrecarregar a 3DX
      var grupos = [];
      for (var g = 0; g < ids.length; g += 6) grupos.push(ids.slice(g, g + 6));
      return grupos.reduce(function (p, grupo) { return p.then(function () { return Promise.all(grupo.map(detalhar)); }); }, Promise.resolve());
    }).then(function () {
      desenhosEstado = falhas && !Object.keys(desenhos).length ? 'erro' : 'ok';
      anotar('Desenhos', desenhosEstado === 'erro' ? 'ERRO' : 'OK', Object.keys(desenhos).length + ' item(ns) com desenho' + (falhas ? ' · ' + falhas + ' falha(s)' : ''));
      desenhar();
    });
  }

  // situação do desenho de um item: 'RELEASED', 'IN_WORK'..., 'FALTA', ou null enquanto carrega
  function statusDesenho(item) {
    if (desenhosEstado === 'ok') return desenhos[item.id] ? desenhos[item.id].state : 'FALTA';
    if (desenhosEstado === 'erro') return 'ERRO';
    return null;
  }

  function tagDesenho(item) {
    var s = statusDesenho(item);
    if (s === null) return '<span class="sm-vazio">...</span>';
    if (s === 'ERRO') return '<span class="sm-vazio">erro</span>';
    if (s === 'FALTA') return '<span class="sm-tag t-pai">falta</span>';
    return '<span class="sm-est e-' + esc(s) + '">' + esc(rotulo(s)) + '</span>';
  }

  function resumoDesenhos() {
    var itens = dados.unicos.map(function (u) { return u.item; }).concat([dados.raiz.item]);
    var r = { total: itens.length, lib: 0, naoLib: 0, sem: 0 };
    itens.forEach(function (it) {
      var s = statusDesenho(it);
      if (s === 'RELEASED') r.lib++; else if (s === 'FALTA') r.sem++; else if (s) r.naoLib++;
    });
    r.faltam = r.sem + r.naoLib;
    return r;
  }

  // itens que pedem ação: parados, pendentes sob pai liberado e liberados sem desenho liberado
  function listaAcao() {
    var lista = [], porId = {};
    dados.acao.forEach(function (u) { var e = { u: u, semDes: false }; lista.push(e); porId[u.item.id] = e; });
    if (desenhosEstado === 'ok') {
      var r = dados.raiz.item;
      dados.unicos.concat([{ item: r, dias: diasDesde(r.modified), pais: {}, parado: false, paiLiberado: false }]).forEach(function (u) {
        if (u.item.state === 'RELEASED' && statusDesenho(u.item) !== 'RELEASED') {
          if (porId[u.item.id]) porId[u.item.id].semDes = true;
          else { var e = { u: u, semDes: true }; lista.push(e); porId[u.item.id] = e; }
        }
      });
    }
    function peso(e) { return (e.u.paiLiberado ? 2 : 0) + (e.semDes ? 2 : 0) + (e.u.parado ? 1 : 0) + (e.u.parado && reservas[e.u.item.id] ? 1 : 0); }
    return lista.sort(function (a, b) { return peso(b) - peso(a) || (b.u.dias || 0) - (a.u.dias || 0); });
  }

  var ICONE_CADEADO = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>';
  function tagReserva(it) {
    var r = reservas[it.id];
    return r ? '<span class="sm-tag t-res" title="Reservado por ' + esc(r.por) + '">' + ICONE_CADEADO + ' ' + esc(r.por || 'reservado') + '</span>' : '';
  }
  function tagRevNova(it) {
    var r = revNovas[it.id];
    return r ? '<span class="sm-tag t-rev" title="A estrutura usa a rev. ' + esc(it.revision) + '">rev. ' + esc(r.revision) + ' ' + esc(rotulo(r.state).toLowerCase()) + '</span>' : '';
  }
  function idxDoItem(id) {
    if (dados.raiz.item.id === id) return 0;
    for (var i = 0; i < dados.nos.length; i++) if (dados.nos[i].item.id === id) return dados.nos[i].idx;
    return 0;
  }

  function link3D(it, texto, forte) {
    return '<button type="button" class="sm-link3d' + (forte ? ' forte' : '') + '" data-id="' + esc(it.id) + '" title="Abrir ' + esc(it.title || it.name) + ' no 3DPlay (nova aba)">' + esc(texto) + '</button>';
  }
  function itemPorId(id) {
    if (dados.raiz.item.id === id) return dados.raiz.item;
    for (var i = 0; i < dados.nos.length; i++) if (dados.nos[i].item.id === id) return dados.nos[i].item;
    return null;
  }

  function celulaThumb(item, idx) {
    var url = thumbs[item.name], miolo;
    if (url) miolo = '<div class="sm-thumb"><img src="' + esc(url) + '" alt="" loading="lazy" /></div>';
    else {
      var txt = thumbsEstado === 'carregando' && !(item.name in thumbs) ? '...' : (thumbsEstado === 'erro' ? 'erro' : 'sem imagem');
      miolo = '<div class="sm-thumb vazio">' + txt + '</div>';
    }
    return '<button type="button" class="sm-thumb-btn" data-idx="' + idx + '" aria-label="Ver detalhes de ' + esc(item.title || item.name) + '">' + miolo + '</button>';
  }

  // ---------- janela de detalhes do item ----------
  function noPorIdx(idx) {
    if (!dados) return null;
    if (idx === 0) return dados.raiz;
    for (var i = 0; i < dados.nos.length; i++) if (dados.nos[i].idx === idx) return dados.nos[i];
    return null;
  }

  function abrirModal(idx) {
    var n = noPorIdx(idx);
    if (!n) return;
    noModal = n;
    var it = n.item, url = thumbs[it.name];
    var alertas = [];
    if (n.temFilhoPendente) alertas.push('<span class="sm-tag t-pai">filho pendente</span>');
    if (n.paiLiberado) alertas.push('<span class="sm-tag t-pai">pai liberado</span>');
    if (n.parado) alertas.push('<span class="sm-tag t-parado">parado</span>');
    $('sm-modal').innerHTML =
      '<div class="sm-modal-fundo" id="sm-modal-fundo">' +
        '<div class="sm-modal" role="dialog" aria-modal="true" aria-labelledby="sm-modal-titulo">' +
          '<div class="sm-modal-topo"><h2 id="sm-modal-titulo">' + esc(it.title || it.name) + '</h2>' +
            '<button type="button" class="sm-fechar" id="sm-modal-fechar" aria-label="Fechar">' + ICONE_X + '</button></div>' +
          '<div class="sm-modal-img">' + (url ? '<img src="' + esc(url) + '" alt="Pré-visualização de ' + esc(it.title || it.name) + '" />' : '<span class="sm-vazio">Sem imagem de pré-visualização na 3DX.</span>') + '</div>' +
          '<dl class="sm-def" style="margin:0">' +
            '<dt>Item</dt><dd class="sm-mono">' + esc(it.name) + '</dd>' +
            '<dt>Revisão</dt><dd>' + esc(it.revision) + '</dd>' +
            '<dt>Estado</dt><dd><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></dd>' +
            '<dt>Owner</dt><dd>' + esc(it.owner) + '</dd>' +
            '<dt>Modificado</dt><dd>' + esc(dataBR(it.modified)) + (n.dias === null || n.dias === undefined ? '' : ' · ' + n.dias + ' dia(s) sem alteração') + '</dd>' +
            '<dt>Reserva</dt><dd>' + (reservas[it.id] ? tagReserva(it) : (extrasEstado === 'ok' ? '<span class="sm-vazio">não reservado</span>' : '<span class="sm-vazio">...</span>')) + '</dd>' +
            (revNovas[it.id] ? '<dt>Revisão nova</dt><dd>' + tagRevNova(it) + ' · owner ' + esc(revNovas[it.id].owner) + ' · ' + esc(dataBR(revNovas[it.id].modified)) + (desenhos[revNovas[it.id].id] ? ' · desenho rev. ' + esc(rotulo(desenhos[revNovas[it.id].id].state).toLowerCase()) : '') + '</dd>' : '') +
            '<dt>Desenho</dt><dd>' + tagDesenho(it) + (desenhos[it.id] ? ' <span class="sm-mono">' + esc(desenhos[it.id].name) + '</span>' : '') + '</dd>' +
            '<dt>Nível</dt><dd>' + n.nivel + (n.filhos.length ? ' · ' + n.filhos.length + ' filho(s)' : '') + '</dd>' +
            (alertas.length ? '<dt>Alertas</dt><dd>' + alertas.join(' ') + '</dd>' : '') +
          '</dl>' +
          '<div class="sm-modal-acoes"><button type="button" class="sm-btn" id="sm-modal-3d">Ver em 3D (3DPlay)</button>' +
            (melhorDesenho(it.id) ? '<button type="button" class="sm-btn" id="sm-modal-2d">Ver desenho (2D)</button>' : '') +
            '<button type="button" class="sm-btn2" id="sm-modal-fechar2">Fechar</button></div>' +
          '<div class="sm-modal-msg" id="sm-modal-msg"><span class="sm-vazio">Abre no 3DPlay da plataforma, numa nova aba, onde dá para girar, dar zoom e medir.</span></div>' +
        '</div></div>';
    $('sm-modal-fechar').focus();
  }

  function fecharModal() { noModal = null; if ($('sm-modal')) $('sm-modal').innerHTML = ''; }

  // link da plataforma que abre um app já com o item carregado (protocolo 3DXContent)
  function linkApp(appId, it) {
    var f = infoFed();
    if (!f) return null;
    var dash = estado.spaceUrl.replace('-space.', '-ifwe.').replace(/\/enovia\/?$/, '');
    var conteudo = {
      protocol: '3DXContent', version: '1.1', source: appId, widgetId: '',
      data: { items: [{ envId: f.tenant, serviceId: '3DSpace', contextId: estado.ctx, objectId: it.id, objectType: it.type || 'VPMReference', displayName: it.title || it.name, displayType: it.type === 'Drawing' ? 'Drawing' : 'Physical Product' }] }
    };
    return dash + '/#app:' + appId + '/content:X3DContentId=' + encodeURIComponent(JSON.stringify(conteudo));
  }

  // abre um item ou desenho no 3DPlay numa nova aba; devolve o html da mensagem para mostrar
  function abrirPorLink(obj, rotuloObj) {
    var url = linkApp(APP_3D, obj);
    if (!url) { anotar('Abrir no 3DPlay', 'ERRO', 'não montei o link'); return '<div class="sm-erro">Não consegui montar o link do 3DPlay.</div>'; }
    var janela = null;
    try { janela = window.open(url, '_blank'); } catch (x) { }
    anotar('Abrir no 3DPlay', 'OK', rotuloObj + ' · ' + (obj.name || ''));
    return janela
      ? '<div class="sm-aviso">Abri ' + esc(rotuloObj) + ' no 3DPlay numa nova aba.</div>'
      : '<div class="sm-aviso">O navegador bloqueou a nova aba. <a href="' + esc(url) + '" target="_blank" rel="noopener">Clique aqui para abrir no 3DPlay</a>.</div>';
  }

  function melhorDesenho(itemId) {
    var lista = (desenhosLista[itemId] || []).slice();
    lista.sort(function (a, b) { return (ORDEM_DES[b.state] || 0) - (ORDEM_DES[a.state] || 0); });
    return lista[0] || null;
  }

  function abrir2D(d) {
    if (!d) return;
    var html = abrirPorLink({ id: d.id, type: 'Drawing', title: d.title, name: d.name }, 'o desenho');
    if ($('sm-modal-msg')) $('sm-modal-msg').innerHTML = html;
  }

  function abrir3D() {
    if (!noModal) return;
    var it = noModal.item, feito = false;
    function msg(html) { if ($('sm-modal-msg')) $('sm-modal-msg').innerHTML = html; }
    function porLink(motivo) {
      if (feito) return; feito = true;
      msg(abrirPorLink(it, 'o item em 3D'));
    }
    // janela da própria 3DX por cima do dashboard, quando o módulo existe aqui; senão, nova aba pelo link
    if (moduloJanelas && moduloJanelas.showWidget) {
      try {
        moduloJanelas.showWidget(APP_3D, it.title || it.name, {
          input: { asset: { physicalid: it.id, dtype: it.type || 'VPMReference', provider: 'EV6', serviceId: '3DSpace', contextId: estado.ctx } }
        });
        feito = true;
        anotar('Abrir em 3D', 'OK', 'janela da 3DX · ' + it.name);
        fecharModal();
        return;
      } catch (e) { /* cai para o link */ }
    }
    porLink(moduloJanelas === false ? 'módulo de janelas indisponível' : 'sem janela da 3DX');
  }

  // verifica uma vez, na abertura, se o módulo de janelas da 3DX existe dentro do widget
  var moduloJanelas = null;
  function verificarModuloJanelas() {
    if (typeof require !== 'function') { moduloJanelas = false; return; }
    try {
      require(['DS/TransientWidget/TransientWidget'], function (TW) { moduloJanelas = TW || false; amostra.moduloJanelas = !!TW; },
        function () { moduloJanelas = false; amostra.moduloJanelas = false; });
    } catch (e) { moduloJanelas = false; }
  }

  // ---------- processamento ----------
  function processar() {
    var raiz = bruto.raiz, membros = bruto.membros;
    var refs = {}, caminhos = [], porTipo = {};
    membros.forEach(function (m) {
      var p = m.Path || m.path;
      var tipo = Array.isArray(p) ? '(Path)' : (m.type || '?');
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
      if (Array.isArray(p)) { caminhos.push(p); return; }
      if (/instance/i.test(m.type || '')) return;
      if (m.id) refs[m.id] = m;
    });
    amostra.expansao = { total: membros.length, porTipo: porTipo };
    if (!refs[raiz.id]) refs[raiz.id] = raiz;

    var limite = cfg.limite;
    var raizNo = { idx: 0, chave: raiz.id, item: refs[raiz.id], nivel: 0, filhos: [], pai: null };
    var porChave = {}; porChave[raiz.id] = raizNo;
    var nos = [];

    function novoNo(chave, item, nivel, pai) {
      var no = { idx: nos.length + 1, chave: chave, item: item, nivel: nivel, filhos: [], pai: pai };
      porChave[chave] = no; pai.filhos.push(no); nos.push(no);
      return no;
    }

    if (caminhos.length) {
      // A 3DX devolve os caminhos até as folhas; as submontagens aparecem no meio.
      caminhos.forEach(function (p) {
        for (var L = 3; L <= p.length; L += 2) {
          var chave = p.slice(0, L).join('/');
          if (porChave[chave]) continue;
          var ref = refs[p[L - 1]];
          var pai = porChave[p.slice(0, L - 2).join('/')];
          if (!ref || !pai) continue;
          novoNo(chave, ref, (L - 1) / 2, pai);
        }
      });
    } else {
      Object.keys(refs).forEach(function (id) { if (id !== raiz.id) novoNo(raiz.id + '/' + id, refs[id], 1, raizNo); });
    }

    // sinais por ocorrência e por item único
    var unicosMapa = {};
    nos.forEach(function (no) {
      var s = no.item.state;
      no.dias = diasDesde(no.item.modified);
      no.parado = (s === 'IN_WORK' || s === 'PRIVATE') && no.dias !== null && no.dias >= limite;
      no.paiLiberado = no.pai && no.pai.item && no.pai.item.state === 'RELEASED' && s !== 'RELEASED' && s !== 'OBSOLETE';
      var u = unicosMapa[no.item.id];
      if (!u) { u = unicosMapa[no.item.id] = { item: no.item, dias: no.dias, parado: false, paiLiberado: false, ocorrencias: 0, pais: {} }; }
      u.ocorrencias++;
      if (no.parado) u.parado = true;
      if (no.paiLiberado) { u.paiLiberado = true; u.pais[no.pai.item.title || no.pai.item.name] = true; }
    });
    // pais com filhos pendentes
    nos.forEach(function (no) {
      no.temFilhoPendente = no.item.state === 'RELEASED' && no.filhos.some(function (f) { return f.paiLiberado; });
    });
    var unicos = Object.keys(unicosMapa).filter(function (id) { return id !== raiz.id; }).map(function (id) { return unicosMapa[id]; });

    var porEstado = {};
    unicos.forEach(function (u) { var s = u.item.state || '?'; porEstado[s] = (porEstado[s] || 0) + 1; });

    // submontagens do 1º nível
    var subs = raizNo.filhos.filter(function (n) { return n.filhos.length; }).map(function (n) {
      var vistos = {}, cont = {}, total = 0, parados = 0, pai = 0;
      (function percorrer(x) {
        x.filhos.forEach(function (f) {
          if (!vistos[f.item.id]) {
            vistos[f.item.id] = true; total++;
            var s = f.item.state || '?'; cont[s] = (cont[s] || 0) + 1;
            if (unicosMapa[f.item.id].parado) parados++;
            if (unicosMapa[f.item.id].paiLiberado) pai++;
          }
          percorrer(f);
        });
      })(n);
      return { no: n, total: total, cont: cont, parados: parados, pai: pai, ids: Object.keys(vistos) };
    });

    // pendências por owner
    var owners = {};
    unicos.forEach(function (u) {
      var s = u.item.state;
      if (s === 'RELEASED' || s === 'OBSOLETE') return;
      var o = u.item.owner || '(sem owner)';
      if (!owners[o]) owners[o] = { owner: o, total: 0, parados: 0 };
      owners[o].total++; if (u.parado) owners[o].parados++;
    });
    var listaOwners = Object.keys(owners).map(function (k) { return owners[k]; }).sort(function (a, b) { return b.total - a.total; });

    // itens que pedem ação
    var acao = unicos.filter(function (u) { return u.parado || u.paiLiberado; }).sort(function (a, b) {
      if (a.paiLiberado !== b.paiLiberado) return a.paiLiberado ? -1 : 1;
      return (b.dias || 0) - (a.dias || 0);
    });

    dados = {
      raiz: raizNo, nos: nos, unicos: unicos, porEstado: porEstado, subs: subs, owners: listaOwners, acao: acao,
      parados: unicos.filter(function (u) { return u.parado; }).length,
      paiLib: unicos.filter(function (u) { return u.paiLiberado; }).length,
      paisComPendencia: nos.filter(function (n) { return n.temFilhoPendente; }).length + (raizNo.item.state === 'RELEASED' && raizNo.filhos.some(function (f) { return f.paiLiberado; }) ? 1 : 0)
    };
  }

  // ---------- desenho da tela ----------
  var CORES = { RELEASED: '#0ca30c', FROZEN: '#3987e5', IN_WORK: '#d95926', PRIVATE: '#9085e9', OBSOLETE: '#8a8984', OUTRO: '#6B7076', FALTA: '#4A4E53' };
  var abaAtiva = lerLocal('sm-aba') || '';

  function barraEstados(cont, total) {
    var ordem = ORDEM_EST.concat(Object.keys(cont).filter(function (s) { return ORDEM_EST.indexOf(s) < 0; }));
    var rot = ordem.filter(function (s) { return cont[s]; }).map(function (s) { return cont[s] + ' ' + rotulo(s).toLowerCase(); }).join(', ');
    var html = '<div class="sm-barra-est" role="img" aria-label="' + esc(rot) + '">';
    ordem.forEach(function (s) { if (cont[s]) html += '<div class="c-' + classeEst(s) + '" style="width:' + (cont[s] * 100 / (total || 1)) + '%" title="' + esc(rotulo(s) + ': ' + cont[s]) + '"></div>'; });
    return html + '</div>';
  }

  // gráfico de rosca em SVG; segs = [{ valor, cor, rotulo }]
  function rosca(segs, centro, sub, aria) {
    var total = 0; segs.forEach(function (s) { total += s.valor; });
    var r = 52, c = 2 * Math.PI * r, vis = segs.filter(function (s) { return s.valor > 0; }).length;
    var gap = vis > 1 ? 2.5 : 0, off = 0, arcos = '';
    segs.forEach(function (s) {
      if (!s.valor) return;
      var len = s.valor / total * c, tam = Math.max(len - gap, 0.8);
      arcos += '<circle class="sm-fatia sm-filtrar" data-filtro="' + esc(s.filtro || '') + '" r="' + r + '" cx="70" cy="70" fill="none" stroke="' + s.cor + '" stroke-width="18" stroke-dasharray="' + tam.toFixed(2) + ' ' + (c - tam).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)">' +
        '<title>' + esc(s.rotulo) + ': ' + s.valor + ' (' + pct(s.valor, total) + '%)</title></circle>';
      off += len;
    });
    return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="' + esc(aria) + '">' +
      '<circle r="' + r + '" cx="70" cy="70" fill="none" stroke="#3A3D40" stroke-width="18"></circle>' + arcos +
      '<text x="70" y="70" text-anchor="middle" font-size="26" font-weight="600" fill="#FFFFFF">' + esc(centro) + '</text>' +
      '<text x="70" y="90" text-anchor="middle" font-size="11" fill="#9AA0A6">' + esc(sub) + '</text></svg>';
  }

  function legenda(segs) {
    var total = 0; segs.forEach(function (s) { total += s.valor; });
    return '<ul class="sm-leg">' + segs.map(function (s) {
      return '<li><button type="button" class="sm-leg-btn sm-filtrar" data-filtro="' + esc(s.filtro || '') + '"' + (s.valor ? '' : ' disabled') + ' aria-label="Filtrar: ' + esc(s.rotulo) + '"><span class="q" style="background:' + s.cor + '"></span><span>' + esc(s.rotulo) + '</span><span class="n">' + s.valor + '</span><span class="p">' + pct(s.valor, total) + '%</span></button></li>';
    }).join('') + '</ul>';
  }

  function cartaoItens(d) {
    var total = d.unicos.length, lib = d.porEstado.RELEASED || 0;
    var ordem = ORDEM_EST.concat(Object.keys(d.porEstado).filter(function (s) { return ORDEM_EST.indexOf(s) < 0; }));
    var segs = ordem.filter(function (s) { return d.porEstado[s] || s === 'RELEASED' || s === 'IN_WORK'; })
      .map(function (s) { return { valor: d.porEstado[s] || 0, cor: CORES[s] || CORES.OUTRO, rotulo: rotulo(s), filtro: 'est:' + s }; });
    return '<div class="sm-cartao"><h3 class="sm-cartao-t">Maturidade dos itens</h3>' +
      '<p class="sm-cartao-s">' + total + ' itens únicos · ' + d.nos.length + ' ocorrências</p>' +
      '<div class="sm-graf">' + rosca(segs, pct(lib, total) + '%', 'liberado', pct(lib, total) + '% dos itens liberados') + legenda(segs) + '</div></div>';
  }

  function cartaoDesenhos() {
    var cab = '<div class="sm-cartao"><h3 class="sm-cartao-t">Desenhos</h3><p class="sm-cartao-s">Peças, submontagens e a montagem principal</p>';
    if (desenhosEstado === '' || desenhosEstado === 'carregando') return cab + '<div class="sm-carregando">Consultando os desenhos na 3DX...</div></div>';
    if (desenhosEstado === 'erro') return cab + '<div class="sm-carregando">Não consegui ler os desenhos. Veja o diagnóstico técnico.</div></div>';
    var rd = resumoDesenhos();
    var segs = [
      { valor: rd.lib, cor: CORES.RELEASED, rotulo: 'Liberado', filtro: 'des:RELEASED' },
      { valor: rd.naoLib, cor: CORES.IN_WORK, rotulo: 'Não liberado', filtro: 'des:NAOLIB' },
      { valor: rd.sem, cor: CORES.FALTA, rotulo: 'Sem desenho', filtro: 'des:FALTA' }
    ];
    return cab + '<div class="sm-graf">' + rosca(segs, pct(rd.lib, rd.total) + '%', 'liberados', pct(rd.lib, rd.total) + '% dos itens com desenho liberado') + legenda(segs) + '</div></div>';
  }

  function cartaoMeta(d) {
    var total = d.unicos.length, lib = d.porEstado.RELEASED || 0;
    var meta = cfg.metaPct, atual = pct(lib, total);
    var faltam = Math.max(0, Math.ceil(meta * total / 100) - lib);
    var dias = null;
    if (cfg.metaData) { var t = Date.parse(cfg.metaData + 'T23:59:59'); if (!isNaN(t)) dias = Math.ceil((t - Date.now()) / 86400000); }
    var status, cls, ritmo = '—';
    if (faltam === 0) { status = 'Meta atingida'; cls = 's-ok'; }
    else if (dias === null) { status = 'Sem data de meta'; cls = 's-neutro'; }
    else if (dias < 0) { status = 'Prazo vencido'; cls = 's-vencido'; }
    else { status = 'Em andamento'; cls = 's-atencao'; ritmo = Math.ceil(faltam / Math.max(dias / 7, 1 / 7)) + '/sem'; }
    var largura = Math.min(atual, 100), alvo = Math.min(meta, 100);
    return '<div class="sm-cartao"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
        '<div><h3 class="sm-cartao-t">Meta de liberação</h3><p class="sm-cartao-s">' + meta + '% dos itens liberados' + (cfg.metaData ? ' até ' + cfg.metaData.split('-').reverse().join('/') : '') + '</p></div>' +
        '<span class="sm-status ' + cls + '">' + esc(status) + '</span></div>' +
      '<div class="sm-meta-num"><strong>' + atual + '%</strong><span>liberado hoje · ' + lib + ' de ' + total + ' itens</span></div>' +
      '<div class="sm-medidor" role="img" aria-label="' + atual + '% liberado de uma meta de ' + meta + '%"><div class="barra" style="width:' + largura + '%"></div><div class="alvo" style="left:calc(' + alvo + '% - 1px)" title="Meta ' + meta + '%"></div></div>' +
      '<div class="sm-medidor-r"><span class="m" style="left:' + alvo + '%;transform:translateX(' + (alvo > 85 ? '-100%' : alvo < 15 ? '0' : '-50%') + ')">meta ' + meta + '%</span></div>' +
      '<div class="sm-meta-dados">' +
        '<div><span>Faltam</span><strong>' + faltam + ' itens</strong></div>' +
        '<div><span>Dias até a meta</span><strong>' + (dias === null ? '—' : Math.max(dias, 0)) + '</strong></div>' +
        '<div><span>Ritmo necessário</span><strong>' + ritmo + '</strong></div>' +
      '</div>' +
      (dias === null && faltam ? '<p class="sm-nota">Defina a data da meta em Configurações para ver o ritmo necessário.</p>' : '') +
      '</div>';
  }

  function kpi(rotuloK, valor, detalhe, classe, chave) {
    var ativo = filtro && filtro.chave === chave;
    return '<button type="button" class="sm-kpi sm-filtrar' + (classe ? ' ' + classe : '') + (ativo ? ' ativo' : '') + '" data-filtro="' + esc(chave) + '" aria-pressed="' + (ativo ? 'true' : 'false') + '" title="Clique para ver estes itens">' +
      '<span class="r">' + esc(rotuloK) + '</span><span class="v">' + valor + '</span><span class="d">' + detalhe + '</span></button>';
  }

  var ROTULOS_FILTRO = { 'kpi:faltamLib': 'Faltam liberar', 'kpi:faltamDes': 'Faltam desenhos', 'kpi:semDesLib': 'Liberados sem desenho', 'kpi:parados': 'Parados', 'kpi:reservados': 'Reservados', 'kpi:revisao': 'Em revisão', 'des:RELEASED': 'Desenho liberado', 'des:NAOLIB': 'Desenho não liberado', 'des:FALTA': 'Sem desenho' };
  function rotuloFiltro(ch) { return ROTULOS_FILTRO[ch] || (ch.indexOf('est:') === 0 ? 'Estado: ' + rotulo(ch.slice(4)) : ch); }

  function itensDoFiltro(ch) {
    var d = dados, r = d.raiz.item;
    var base = d.unicos.map(function (u) { return { item: u.item, dias: u.dias, parado: u.parado }; });
    var comRaiz = base.concat([{ item: r, dias: diasDesde(r.modified), parado: false }]);
    function sd(e) { return statusDesenho(e.item); }
    if (ch.indexOf('est:') === 0) { var st = ch.slice(4); return base.filter(function (e) { return e.item.state === st; }); }
    if (ch === 'des:RELEASED') return comRaiz.filter(function (e) { return sd(e) === 'RELEASED'; });
    if (ch === 'des:NAOLIB') return comRaiz.filter(function (e) { var x = sd(e); return x && x !== 'RELEASED' && x !== 'FALTA' && x !== 'ERRO'; });
    if (ch === 'des:FALTA') return comRaiz.filter(function (e) { return sd(e) === 'FALTA'; });
    if (ch === 'kpi:faltamLib') return base.filter(function (e) { return e.item.state !== 'RELEASED' && e.item.state !== 'OBSOLETE'; });
    if (ch === 'kpi:faltamDes') return comRaiz.filter(function (e) { var x = sd(e); return x && x !== 'RELEASED' && x !== 'ERRO'; });
    if (ch === 'kpi:semDesLib') return comRaiz.filter(function (e) { var x = sd(e); return e.item.state === 'RELEASED' && x && x !== 'RELEASED' && x !== 'ERRO'; });
    if (ch === 'kpi:parados') return base.filter(function (e) { return e.parado; });
    if (ch === 'kpi:reservados') return comRaiz.filter(function (e) { return reservas[e.item.id]; });
    if (ch === 'kpi:revisao') return comRaiz.filter(function (e) { return revNovas[e.item.id]; });
    return [];
  }

  function aplicarFiltro(ch) {
    if (!ch || !dados) return;
    if (filtro && filtro.chave === ch) { filtro = null; if (abaAtiva === 'filtro') abaAtiva = 'estrutura'; }
    else { filtro = { chave: ch, rotulo: rotuloFiltro(ch) }; abaAtiva = 'filtro'; }
    desenhar();
    var caixa = document.getElementById('sm-abas-caixa');
    if (caixa && filtro && caixa.scrollIntoView) { try { caixa.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) { caixa.scrollIntoView(); } }
  }

  function painelFiltro() {
    var lista = itensDoFiltro(filtro.chave);
    var html = '<div class="sm-painel-topo"><p>' + lista.length + ' item(ns) em <strong>' + esc(filtro.rotulo) + '</strong>. Clique na thumbnail para ver os detalhes.</p>' +
      '<button type="button" class="sm-btn2" id="sm-limpar-filtro">Limpar filtro</button></div>';
    if (!lista.length) return html + '<p class="sm-vazio">Nenhum item neste filtro.</p>';
    html += '<div class="sm-tabela"><table style="min-width:960px"><thead><tr><th>Thumbnail</th><th>Título</th><th>Rev.</th><th>Estado</th><th>Desenho</th><th>Owner</th><th>Reserva</th><th>Revisão nova</th><th class="num">Sem alteração</th></tr></thead><tbody>';
    lista.slice(0, 500).forEach(function (e) {
      var it = e.item;
      html += '<tr><td class="sm-celthumb">' + celulaThumb(it, idxDoItem(it.id)) + '</td><td title="' + esc(it.name) + '">' + link3D(it, it.title || it.name, true) + '</td><td>' + esc(it.revision) + '</td>' +
        '<td><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></td><td>' + tagDesenho(it) + '</td><td>' + esc(it.owner) + '</td>' +
        '<td>' + (tagReserva(it) || '<span class="sm-vazio">—</span>') + '</td><td>' + (tagRevNova(it) || '<span class="sm-vazio">—</span>') + '</td>' +
        '<td class="num">' + (e.dias === null || e.dias === undefined ? '—' : e.dias + ' dias') + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  function desenhar() {
    if (!dados) return;
    var d = dados, r = d.raiz.item, total = d.unicos.length;
    $('sm-lido').textContent = 'Lido às ' + bruto.lido;
    var acaoLista = listaAcao();
    var naoLib = d.unicos.filter(function (u) { return u.item.state !== 'RELEASED' && u.item.state !== 'OBSOLETE'; }).length;
    var desOk = desenhosEstado === 'ok', rd = resumoDesenhos();
    var semDesLib = acaoLista.filter(function (e) { return e.semDes; }).length;
    if (!abaAtiva || (abaAtiva === 'filtro' && !filtro)) abaAtiva = acaoLista.length ? 'acao' : 'estrutura';
    var exOk = extrasEstado === 'ok';
    var nRes = 0, nResPar = 0, nRev = 0;
    itensDoFiltro('kpi:reservados').forEach(function (e) { nRes++; if (e.parado) nResPar++; });
    nRev = itensDoFiltro('kpi:revisao').length;

    var html = '';
    // cabeçalho da montagem
    var img = thumbs[r.name];
    html += '<div class="sm-cartao sm-cab">' +
      '<button type="button" class="sm-thumb-btn" data-idx="0" aria-label="Ver detalhes da montagem"><div class="sm-cab-img">' + (img ? '<img src="' + esc(img) + '" alt="" />' : '<span class="sm-vazio">...</span>') + '</div></button>' +
      '<div style="min-width:0;flex:1 1 300px"><h2>' + link3D(r, r.title || r.name) + '</h2>' +
      '<div class="sm-cab-meta"><span class="sm-mono">' + esc(r.name) + '</span><span>Rev. ' + esc(r.revision) + '</span>' +
      '<span class="sm-est e-' + esc(r.state) + '">' + esc(rotulo(r.state)) + '</span><span>Owner ' + esc(r.owner) + '</span>' +
      '<span>Desenho ' + tagDesenho(r) + '</span>' + tagReserva(r) + tagRevNova(r) + '</div></div></div>';

    // resumo visual
    html += '<div class="sm-resumo">' + cartaoItens(d) + cartaoDesenhos() + cartaoMeta(d) + '</div>';

    // indicadores
    html += '<div class="sm-kpis">' +
      kpi('Faltam liberar', naoLib, 'de ' + total + ' itens únicos', naoLib ? 'atencao' : '', 'kpi:faltamLib') +
      kpi('Faltam desenhos', desOk ? rd.faltam : '...', desOk ? rd.sem + ' sem desenho · ' + rd.naoLib + ' não liberado(s)' : 'consultando', desOk && rd.faltam ? 'atencao' : '', 'kpi:faltamDes') +
      kpi('Liberados sem desenho', desOk ? semDesLib : '...', 'liberado sem desenho liberado', desOk && semDesLib ? 'alerta' : '', 'kpi:semDesLib') +
      kpi('Parados', d.parados, cfg.limite + ' dias ou mais sem alteração', d.parados ? 'atencao' : '', 'kpi:parados') +
      kpi('Reservados', exOk ? nRes : '...', exOk ? (nResPar ? nResPar + ' reservado(s) e parado(s)' : 'travados para edição') : 'consultando', exOk && nResPar ? 'atencao' : '', 'kpi:reservados') +
      kpi('Em revisão', exOk ? nRev : '...', 'revisão nova em andamento', '', 'kpi:revisao') +
      '</div>';

    // abas
    var abas = [
      { id: 'acao', nome: 'Pedem ação', cont: acaoLista.length, alerta: acaoLista.length > 0 },
      { id: 'estrutura', nome: 'Estrutura', cont: d.nos.length },
      { id: 'subs', nome: 'Submontagens', cont: d.subs.length },
      { id: 'owners', nome: 'Responsáveis', cont: d.owners.length }
    ];
    if (filtro) abas.push({ id: 'filtro', nome: 'Filtro: ' + filtro.rotulo, cont: itensDoFiltro(filtro.chave).length });
    html += '<div class="sm-abas-caixa" id="sm-abas-caixa"><div class="sm-abas" role="tablist" aria-label="Detalhes">' + abas.map(function (a) {
      var sel = a.id === abaAtiva;
      return '<button type="button" class="sm-aba" role="tab" id="sm-aba-' + a.id + '" data-aba="' + a.id + '" aria-selected="' + sel + '" aria-controls="sm-painel">' +
        esc(a.nome) + '<span class="cont' + (a.alerta ? ' alerta' : '') + '">' + a.cont + '</span></button>';
    }).join('') + '</div><div class="sm-painel" id="sm-painel" role="tabpanel" aria-labelledby="sm-aba-' + abaAtiva + '">' +
      (abaAtiva === 'filtro' && filtro ? painelFiltro() : abaAtiva === 'acao' ? painelAcao(acaoLista) : abaAtiva === 'subs' ? painelSubs(d) : abaAtiva === 'owners' ? painelOwners(d) : painelEstrutura()) +
      '</div></div>';

    $('sm-conteudo').innerHTML = html;
    if (abaAtiva === 'estrutura') desenharArvore();
  }

  function painelAcao(lista) {
    var html = '<div class="sm-painel-topo"><p>Itens parados há ' + cfg.limite + ' dias ou mais, pendentes sob pai liberado' + (desenhosEstado === 'ok' ? ' ou liberados sem desenho liberado' : '') + '. Os mais graves vêm primeiro.</p></div>';
    if (!lista.length) return html + '<p class="sm-vazio">Nada pedindo ação nesta montagem.</p>';
    html += '<div class="sm-tabela"><table style="min-width:900px"><thead><tr><th>Título</th><th>Rev.</th><th>Estado</th><th>Desenho</th><th>Owner</th><th>Por que está aqui</th><th class="num">Sem alteração</th></tr></thead><tbody>';
    lista.slice(0, 200).forEach(function (e) {
      var u = e.u, it = u.item, motivos = [];
      if (u.paiLiberado) motivos.push('<span class="sm-tag t-pai">pai liberado: ' + esc(Object.keys(u.pais).join(', ')) + '</span>');
      if (e.semDes) motivos.push('<span class="sm-tag t-pai">liberado sem desenho liberado</span>');
      if (u.parado) motivos.push('<span class="sm-tag t-parado">' + (reservas[it.id] ? 'parado e reservado' : 'parado') + '</span>');
      html += '<tr><td title="' + esc(it.name) + '">' + link3D(it, it.title || it.name) + '</td><td>' + esc(it.revision) + '</td>' +
        '<td><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></td><td>' + tagDesenho(it) + '</td><td>' + esc(it.owner) + '</td>' +
        '<td>' + motivos.join(' ') + '</td><td class="num">' + (u.dias === null || u.dias === undefined ? '—' : u.dias + ' dias') + '</td></tr>';
    });
    return html + '</tbody></table></div>' + (lista.length > 200 ? '<p class="sm-nota">Mostrando 200 de ' + lista.length + '. Use o Excel para ver todos.</p>' : '');
  }

  function painelEstrutura() {
    return '<div class="sm-painel-topo"><p id="sm-arvore-nota"></p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="sm-btn2" id="sm-exp-tudo">Expandir tudo</button>' +
      '<button type="button" class="sm-btn2" id="sm-rec-tudo">Recolher tudo</button></div></div>' +
      '<div class="sm-tabela" id="sm-arvore"></div>';
  }

  function painelSubs(d) {
    var html = '<div class="sm-painel-topo"><p>Submontagens do 1º nível, com a maturidade de tudo o que está abaixo de cada uma.</p></div>';
    if (!d.subs.length) return html + '<p class="sm-vazio">Esta montagem não tem submontagens no 1º nível.</p>';
    html += '<div class="sm-tabela"><table style="min-width:760px"><thead><tr><th>Submontagem</th><th>Estado</th><th class="num">Itens</th><th style="width:28%">Distribuição</th><th class="num">Liberado</th><th class="num">Desenhos liberados</th><th>Alertas</th></tr></thead><tbody>';
    d.subs.forEach(function (s) {
      var it = s.no.item, l = s.cont.RELEASED || 0, celDes = '...';
      if (desenhosEstado === 'ok') {
        var libDes = 0, vistosDes = {};
        s.ids.concat([it.id]).forEach(function (id) { if (vistosDes[id]) return; vistosDes[id] = 1; if (desenhos[id] && desenhos[id].state === 'RELEASED') libDes++; });
        celDes = libDes + ' de ' + Object.keys(vistosDes).length;
      } else if (desenhosEstado === 'erro') celDes = '—';
      var alertas = '';
      if (s.no.temFilhoPendente) alertas += '<span class="sm-tag t-pai">liberada com filho pendente</span> ';
      if (s.parados) alertas += '<span class="sm-tag t-parado">' + s.parados + ' parado(s)</span>';
      html += '<tr' + (s.no.temFilhoPendente ? ' class="marcada"' : '') + '><td>' + link3D(it, it.title || it.name, true) + '</td>' +
        '<td><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></td>' +
        '<td class="num">' + s.total + '</td><td>' + barraEstados(s.cont, s.total) + '</td>' +
        '<td class="num">' + pct(l, s.total) + '%</td><td class="num">' + celDes + '</td><td>' + (alertas || '<span class="sm-vazio">—</span>') + '</td></tr>';
    });
    return html + '</tbody></table></div>';
  }

  function painelOwners(d) {
    var html = '<div class="sm-painel-topo"><p>Itens únicos ainda não liberados, por owner.</p></div>';
    if (!d.owners.length) return html + '<p class="sm-vazio">Nenhuma pendência: todos os itens estão liberados.</p>';
    var maior = d.owners[0].total || 1;
    html += '<div class="sm-owner-g"><span class="cab">Owner</span><span class="cab">Pendências</span><span class="cab num">Itens</span><span class="cab num so-larga">Parados</span>';
    d.owners.forEach(function (o) {
      html += '<span title="' + esc(o.owner) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(o.owner) + '</span>' +
        '<div class="sm-owner-b" role="img" aria-label="' + o.total + ' pendências"><div style="width:' + (o.total * 100 / maior) + '%"></div></div>' +
        '<span class="num"><strong>' + o.total + '</strong></span><span class="num so-larga">' + (o.parados ? '<span class="sm-tag t-parado">' + o.parados + '</span>' : '—') + '</span>';
    });
    html += '</div>';
    var porPessoa = {};
    itensDoFiltro('kpi:reservados').forEach(function (e) { var p = reservas[e.item.id].por || '(sem nome)'; (porPessoa[p] = porPessoa[p] || []).push(e); });
    var pessoas = Object.keys(porPessoa).sort(function (a, b) { return porPessoa[b].length - porPessoa[a].length; });
    if (pessoas.length) {
      html += '<h4 class="sm-sub">Reservas por pessoa</h4><div class="sm-tabela"><table style="min-width:520px"><thead><tr><th>Pessoa</th><th class="num">Reservados</th><th class="num">Parados</th><th>Itens</th></tr></thead><tbody>';
      pessoas.forEach(function (p) {
        var l = porPessoa[p], par = l.filter(function (e) { return e.parado; }).length;
        html += '<tr><td><strong>' + esc(p) + '</strong></td><td class="num">' + l.length + '</td><td class="num">' + (par ? '<span class="sm-tag t-parado">' + par + '</span>' : '—') + '</td><td>' + l.map(function (e) { return esc(e.item.title || e.item.name); }).join(', ') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    return html;
  }

  function desenhosDe(no) { return desenhosEstado === 'ok' ? (desenhosLista[no.item.id] || []) : []; }
  function temConteudo(no) { return no.filhos.length > 0 || desenhosDe(no).length > 0; }

  var ICONE_2D = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M15 3v4h4"></path><path d="M8 17l3-5 2 3 1.5-2L17 17z"></path></svg>';

  function linhaDesenho(n, d) {
    var recuo = n.nivel * 22, dias = diasDesde(d.modified);
    var alerta = n.item.state === 'RELEASED' && d.state !== 'RELEASED' ? '<span class="sm-tag t-pai">peça liberada, desenho não</span>' : '';
    return '<tr class="sm-linha2d">' +
      '<td class="num">' + (n.nivel + 1) + '</td>' +
      '<td><span class="sm-nome" style="padding-left:' + recuo + 'px" title="' + esc(d.name) + '"><span class="sm-tg-vazio"></span>' +
        '<span class="sm-tag t-2d">2D</span><button type="button" class="sm-link2d" data-item="' + esc(n.item.id) + '" data-des="' + esc(d.id) + '" title="Abrir o desenho no 3DPlay">' + esc(d.title || d.name) + '</button><span class="sm-filhos">desenho de ' + esc(n.item.title || n.item.name) + '</span></span></td>' +
      '<td class="sm-celthumb"><div class="sm-thumb vazio" style="color:#9AA0A6">' + ICONE_2D + '</div></td>' +
      '<td>' + esc(d.revision) + '</td>' +
      '<td><span class="sm-est e-' + esc(d.state) + '">' + esc(rotulo(d.state)) + '</span></td>' +
      '<td><span class="sm-vazio">—</span></td>' +
      '<td>' + esc(dataBR(d.modified)) + '</td><td>' + esc(d.owner) + '</td>' +
      '<td class="num">' + (dias === null ? '—' : dias) + '</td><td>' + alerta + '</td></tr>';
  }

  function desenharArvore() {
    if (!dados || !$('sm-arvore')) return;
    var linhas = [];   // { no } para itens 3D, { no, d } para desenhos 2D
    var cortado = false;
    (function percorrer(no) {
      for (var i = 0; i < no.filhos.length; i++) {
        if (linhas.length >= LIMITE_LINHAS) { cortado = true; return; }
        var f = no.filhos[i];
        linhas.push({ no: f });
        if (aberto[f.idx]) {
          desenhosDe(f).forEach(function (d) { linhas.push({ no: f, d: d }); });
          if (f.filhos.length) percorrer(f);
        }
      }
    })(dados.raiz);

    var html = '<table style="min-width:900px"><thead><tr><th class="num">Nível</th><th>Título</th><th>Thumbnail</th><th>Rev.</th><th>Estado</th><th>Desenho</th><th>Modificado</th><th>Owner</th><th class="num">Dias</th><th>Alertas</th></tr></thead><tbody>';
    var n3d = 0;
    linhas.forEach(function (l) {
      if (l.d) { html += linhaDesenho(l.no, l.d); return; }
      n3d++;
      var n = l.no;
      var it = n.item, recuo = (n.nivel - 1) * 22;
      var nDes = desenhosDe(n).length;
      var botao = temConteudo(n)
        ? '<button type="button" class="sm-tg" data-idx="' + n.idx + '" aria-expanded="' + (aberto[n.idx] ? 'true' : 'false') + '" aria-label="' + (aberto[n.idx] ? 'Recolher' : 'Expandir') + ' ' + esc(it.title || it.name) + '">' + (aberto[n.idx] ? ICONE_ABERTO : ICONE_FECHADO) + '</button>'
        : '<span class="sm-tg-vazio"></span>';
      var contagem = [];
      if (n.filhos.length) contagem.push(n.filhos.length);
      if (nDes) contagem.push(nDes + ' 2D');
      var alertas = '';
      if (n.temFilhoPendente) alertas += '<span class="sm-tag t-pai">filho pendente</span> ';
      if (n.paiLiberado) alertas += '<span class="sm-tag t-pai">pai liberado</span> ';
      if (n.parado) alertas += '<span class="sm-tag t-parado">parado</span> ';
      alertas += tagRevNova(it) + ' ' + tagReserva(it);
      html += '<tr' + (n.paiLiberado || n.temFilhoPendente ? ' class="marcada"' : '') + '>' +
        '<td class="num">' + n.nivel + '</td>' +
        '<td><span class="sm-nome" style="padding-left:' + recuo + 'px" title="' + esc(it.name) + '">' + botao + link3D(it, it.title || it.name, n.filhos.length > 0) +
          (contagem.length ? '<span class="sm-filhos">(' + contagem.join(' · ') + ')</span>' : '') + '</span></td>' +
        '<td class="sm-celthumb">' + celulaThumb(it, n.idx) + '</td>' +
        '<td>' + esc(it.revision) + '</td>' +
        '<td><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></td>' +
        '<td>' + tagDesenho(it) + '</td>' +
        '<td>' + esc(dataBR(it.modified)) + '</td><td>' + esc(it.owner) + '</td>' +
        '<td class="num">' + (n.dias === null ? '—' : n.dias) + '</td><td>' + (alertas || '') + '</td></tr>';
    });
    html += '</tbody></table>';
    $('sm-arvore').innerHTML = html;
    var abertos = Object.keys(aberto).length;
    $('sm-arvore-nota').textContent = 'Mostrando ' + n3d + ' de ' + dados.nos.length + ' itens 3D' + (linhas.length > n3d ? ' e ' + (linhas.length - n3d) + ' desenho(s) 2D' : '') +
      (abertos ? '' : ' · use as setas para abrir as submontagens e ver os desenhos') +
      (cortado ? ' · lista cortada em ' + LIMITE_LINHAS + ' linhas, use Exportar para ver tudo' : '') + '.';
  }

  function expandirTudo() {
    aberto = {};
    dados.nos.forEach(function (n) { if (temConteudo(n)) aberto[n.idx] = true; });
    desenharArvore();
  }

  // ---------- exportação ----------
  function exportar() {
    if (!dados) return;
    var sep = ';';
    function cel(v) { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    function des(it) { var s = statusDesenho(it); return s === null ? '' : s === 'FALTA' ? 'Falta' : s === 'ERRO' ? '' : rotulo(s); }
    function res(it) { return reservas[it.id] ? (reservas[it.id].por || 'sim') : ''; }
    function rnv(it) { return revNovas[it.id] ? 'rev. ' + revNovas[it.id].revision + ' ' + rotulo(revNovas[it.id].state) : ''; }
    var linhas = [['Nível', 'Item', 'Título', 'Revisão', 'Estado', 'Desenho', 'Reservado por', 'Revisão nova', 'Owner', 'Modificado', 'Dias sem alteração', 'Alertas'].join(sep)];
    var r = dados.raiz.item;
    linhas.push(['0', r.name, r.title, r.revision, rotulo(r.state), des(r), res(r), rnv(r), r.owner, dataBR(r.modified), '', ''].map(cel).join(sep));
    (function percorrer(no) {
      no.filhos.forEach(function (n) {
        var it = n.item, a = [];
        if (n.temFilhoPendente) a.push('filho pendente');
        if (n.paiLiberado) a.push('pai liberado');
        if (n.parado) a.push('parado');
        if (it.state === 'RELEASED' && statusDesenho(it) && statusDesenho(it) !== 'RELEASED' && statusDesenho(it) !== 'ERRO') a.push('liberado sem desenho liberado');
        linhas.push([n.nivel, it.name, it.title, it.revision, rotulo(it.state), des(it), res(it), rnv(it), it.owner, dataBR(it.modified), n.dias === null ? '' : n.dias, a.join(', ')].map(cel).join(sep));
        percorrer(n);
      });
    })(dados.raiz);
    var conteudo = '﻿' + linhas.join('\r\n');
    var nome = 'status-' + String(r.title || r.name).replace(/[^\w.-]+/g, '_') + '.csv';
    try {
      var blob = new Blob([conteudo], { type: 'text/csv;charset=utf-8' });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, nome); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nome;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 1000);
    } catch (e) {
      mostrarAviso('Não consegui baixar o arquivo: ' + esc(textoErro(e)), 'erro');
    }
  }

  // ---------- configurações ----------
  function carregarCfg() {
    var l = parseInt(lerLocal('sm-limite'), 10); if (l >= 0) cfg.limite = l;
    var m = parseInt(lerLocal('sm-meta'), 10); if (m > 0 && m <= 100) cfg.metaPct = m;
    cfg.metaData = lerLocal('sm-data') || '';
    $('sm-limite').value = cfg.limite; $('sm-meta').value = cfg.metaPct; $('sm-data').value = cfg.metaData;
  }
  function mudouCfg() {
    var l = parseInt($('sm-limite').value, 10), m = parseInt($('sm-meta').value, 10);
    if (l >= 0) { cfg.limite = l; gravarLocal('sm-limite', String(l)); }
    if (m > 0 && m <= 100) { cfg.metaPct = m; gravarLocal('sm-meta', String(m)); }
    cfg.metaData = $('sm-data').value || ''; gravarLocal('sm-data', cfg.metaData);
    if (bruto) {
      var antes = aberto;
      processar();
      aberto = antes;
      desenhar();
    }
  }

  // ---------- início ----------
  function modoForaDoDashboard() {
    if (conectado) return;
    $('sm-conexao').textContent = 'Fora do 3DDashboard';
    mostrarAviso('<strong>A hospedagem está funcionando.</strong> Este widget só lê dados quando aberto dentro do 3DDashboard, pelo app Run Your App.');
  }

  function iniciar() {
    var raizDom = (typeof widget !== 'undefined' && widget.body) ? widget.body : document.body;
    raizDom.innerHTML = TEMPLATE;
    registro = [];
    carregarCfg();
    $('sm-buscar').addEventListener('click', buscar);
    $('sm-nome').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') buscar(); });
    $('sm-atualizar').addEventListener('click', function () { if (bruto) ler(bruto.raiz); });
    $('sm-exportar').addEventListener('click', exportar);
    $('sm-config-btn').addEventListener('click', function () {
      var painel = $('sm-config'), abrir = painel.hasAttribute('hidden');
      if (abrir) painel.removeAttribute('hidden'); else painel.setAttribute('hidden', '');
      this.setAttribute('aria-expanded', abrir ? 'true' : 'false');
    });
    ['sm-limite', 'sm-meta', 'sm-data'].forEach(function (id) { $(id).addEventListener('change', mudouCfg); });
    // cliques dentro do conteúdo (escolha da busca, setas e botões da árvore)
    $('sm-conteudo').addEventListener('click', function (ev) {
      var alvo = ev.target;
      while (alvo && alvo !== this && !(alvo.classList && (alvo.classList.contains('sm-tg') || alvo.classList.contains('sm-thumb-btn') || alvo.classList.contains('sm-link2d') || alvo.classList.contains('sm-link3d') || alvo.classList.contains('sm-escolha') || alvo.classList.contains('sm-aba') || alvo.classList.contains('sm-filtrar') || alvo.id === 'sm-limpar-filtro' || alvo.id === 'sm-exp-tudo' || alvo.id === 'sm-rec-tudo'))) alvo = alvo.parentNode;
      if (!alvo || alvo === this) return;
      if (alvo.classList.contains('sm-thumb-btn')) { abrirModal(Number(alvo.getAttribute('data-idx'))); return; }
      if (alvo.classList.contains('sm-link3d')) {
        var it3 = itemPorId(alvo.getAttribute('data-id'));
        if (it3) { var m3 = abrirPorLink(it3, 'o item em 3D'); if (/bloqueou/.test(m3)) mostrarAviso(m3.replace(/^<div class="sm-aviso">|<\/div>$/g, '')); }
        return;
      }
      if (alvo.classList.contains('sm-link2d')) {
        var idDes = alvo.getAttribute('data-des');
        var achado = (desenhosLista[alvo.getAttribute('data-item')] || []).filter(function (x) { return x.id === idDes; })[0];
        if (achado) { var m = abrirPorLink({ id: achado.id, type: 'Drawing', title: achado.title, name: achado.name }, 'o desenho'); if (/bloqueou/.test(m)) mostrarAviso(m.replace(/^<div class="sm-aviso">|<\/div>$/g, '')); }
        return;
      }
      if (alvo.id === 'sm-limpar-filtro') { filtro = null; abaAtiva = 'estrutura'; desenhar(); return; }
      if (alvo.classList.contains('sm-filtrar')) { aplicarFiltro(alvo.getAttribute('data-filtro')); return; }
      if (alvo.classList.contains('sm-aba')) { abaAtiva = alvo.getAttribute('data-aba'); gravarLocal('sm-aba', abaAtiva); desenhar(); return; }
      if (alvo.classList.contains('sm-escolha')) { ler(encontrados[Number(alvo.getAttribute('data-i'))]); return; }
      if (alvo.id === 'sm-exp-tudo') { expandirTudo(); return; }
      if (alvo.id === 'sm-rec-tudo') { aberto = {}; desenharArvore(); return; }
      var idx = Number(alvo.getAttribute('data-idx'));
      if (aberto[idx]) delete aberto[idx]; else aberto[idx] = true;
      desenharArvore();
    });
    // janela de detalhes: fechar clicando fora, no X, em Fechar ou com Esc
    $('sm-modal').addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.id === 'sm-modal-fundo') { fecharModal(); return; }
      while (t && t !== this) {
        if (t.id === 'sm-modal-fechar' || t.id === 'sm-modal-fechar2') { fecharModal(); return; }
        if (t.id === 'sm-modal-3d') { abrir3D(); return; }
        if (t.id === 'sm-modal-2d') { if (noModal) abrir2D(melhorDesenho(noModal.item.id)); return; }
        t = t.parentNode;
      }
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && noModal) fecharModal(); });
    if (typeof require !== 'function') { modoForaDoDashboard(); return; }
    var esperando = setTimeout(function () { if (!WAF) modoForaDoDashboard(); }, 15000);
    require(['DS/WAFData/WAFData'], function (W) {
      clearTimeout(esperando);
      WAF = W;
      conectar();
      verificarModuloJanelas();
    }, function () { clearTimeout(esperando); modoForaDoDashboard(); });
  }

  if (typeof widget !== 'undefined' && widget.addEvent) widget.addEvent('onLoad', iniciar);
  else document.addEventListener('DOMContentLoaded', iniciar);

  // usado só para testes fora do dashboard
  window.__smTeste = { processar: function (raiz, membros, limite) { cfg.limite = limite || 15; bruto = { raiz: raiz, membros: membros, lido: '' }; processar(); return dados; } };
})();
</script>

<p style="font-family: Arial, sans-serif; padding: 16px">Carregando...</p>
