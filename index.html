<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; background: #F3F4F6; }
  .sm-root {
    --fundo: #F3F4F6; --card: #FFFFFF; --borda: #E2E5EA; --borda-forte: #C9CED6;
    --texto: #17202A; --texto2: #4B5563; --texto3: #6B7280;
    --primaria: #1F3A5F; --primaria-h: #16304F; --link: #1D5C99;
    --c-lib: #0ca30c; --c-cong: #2a78d6; --c-trab: #eb6834; --c-priv: #6250d6; --c-obs: #8a8984; --c-falta: #D5D8DE;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--texto); font-size: 14px; line-height: 1.4;
    box-sizing: border-box; height: 100vh; overflow-y: auto; background: var(--fundo);
  }
  .sm-root * { box-sizing: border-box; }
  .sm-app { max-width: 1440px; margin: 0 auto; padding: 0 0 24px; }

  /* barra superior */
  .sm-topo { background: var(--primaria); color: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 20px; }
  .sm-marca { display: flex; align-items: center; gap: 10px; }
  .sm-marca h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
  .sm-selo { font-size: 11px; background: rgba(255,255,255,0.14); padding: 2px 8px; border-radius: 10px; }
  .sm-conexao { font-size: 12px; color: #D6DEE8; }

  /* barra de busca */
  .sm-barra { background: var(--card); border-bottom: 1px solid var(--borda); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .sm-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sm-busca { position: relative; }
  .sm-busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--texto3); pointer-events: none; }
  .sm-busca input { height: 38px; width: 340px; max-width: 70vw; padding: 0 12px 0 34px; border: 1px solid var(--borda-forte); border-radius: 6px; font: inherit; color: var(--texto); background: #fff; }
  .sm-busca input:focus, .sm-campo input:focus { outline: 2px solid #9DB8D9; outline-offset: 0; border-color: var(--primaria); }
  .sm-lido { font-size: 12px; color: var(--texto3); }
  .sm-btn { height: 38px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--primaria); color: #fff; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .sm-btn:hover { background: var(--primaria-h); }
  .sm-btn[disabled] { background: #9AA3AE; cursor: default; }
  .sm-btn2 { height: 38px; padding: 0 12px; border: 1px solid var(--borda-forte); border-radius: 6px; background: #fff; color: var(--texto); font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .sm-btn2:hover { background: #F6F7F9; }
  .sm-btn2[disabled] { color: #9AA3AE; cursor: default; background: #fff; }
  .sm-btn2[aria-expanded="true"] { background: #EEF2F7; border-color: var(--primaria); }

  /* configurações */
  .sm-config { background: #F8F9FB; border-bottom: 1px solid var(--borda); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .sm-config[hidden] { display: none; }
  .sm-campo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--texto2); font-weight: 600; }
  .sm-campo input { height: 36px; padding: 0 10px; border: 1px solid var(--borda-forte); border-radius: 6px; font: inherit; font-weight: 400; color: var(--texto); background: #fff; }

  .sm-corpo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  #sm-conteudo { display: flex; flex-direction: column; gap: 16px; }

  /* cartões */

  .sm-cartao-t { margin: 0; font-size: 13px; font-weight: 600; color: var(--texto2); text-transform: uppercase; letter-spacing: 0.5px; }
  .sm-cartao-s { margin: 2px 0 0; font-size: 12px; color: var(--texto3); }

  .sm-cab-img img { max-width: 100%; max-height: 100%; }
  .sm-cab h2 { margin: 0; font-size: 20px; font-weight: 600; word-break: break-word; }
  .sm-cab-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--texto2); }

  /* resumo com gráficos */
  .sm-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .sm-graf { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 14px; }
  .sm-graf svg { flex: none; }
  .sm-leg { list-style: none; margin: 0; padding: 0; flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .sm-leg li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13px; }
  .sm-leg .q { width: 12px; height: 12px; border-radius: 3px; }
  .sm-leg .n { font-weight: 600; text-align: right; min-width: 24px; }
  .sm-leg .p { color: var(--texto3); text-align: right; min-width: 36px; font-size: 12px; }
  .sm-carregando { display: flex; align-items: center; gap: 10px; color: var(--texto3); font-size: 13px; margin-top: 14px; min-height: 140px; }

  .s-ok { background: #E6F4EA; color: #1E6B34; } .s-atencao { background: #FFF3D6; color: #7A5200; } .s-vencido { background: #FDE8E8; color: #A12828; } .s-neutro { background: #EEF0F3; color: #3A414A; }
  .sm-meta-num { display: flex; align-items: baseline; gap: 8px; margin-top: 14px; }
  .sm-meta-num strong { font-size: 34px; font-weight: 700; line-height: 1; }
  .sm-meta-num span { color: var(--texto3); font-size: 13px; }
  .sm-medidor { position: relative; height: 12px; background: #EEF0F3; border-radius: 6px; margin: 14px 0 6px; }

  .sm-medidor .alvo { position: absolute; top: -5px; width: 2px; height: 22px; background: var(--texto); }

  .sm-medidor-r .m { position: absolute; top: 0; transform: translateX(-50%); color: var(--texto); font-weight: 600; white-space: nowrap; }
  .sm-meta-dados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .sm-meta-dados div span { display: block; font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: 0.4px; }
  .sm-meta-dados div strong { display: block; font-size: 17px; font-weight: 600; margin-top: 2px; }

  /* indicadores */
  .sm-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .sm-kpi { background: var(--card); border: 1px solid var(--borda); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .sm-kpi .r { font-size: 12px; color: var(--texto2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sm-kpi .v { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .sm-kpi .d { font-size: 12px; color: var(--texto3); }
  .sm-kpi.alerta .v { color: #A12828; }
  .sm-kpi.atencao .v { color: #8A4A0B; }
  .sm-ponto { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* abas */
  .sm-abas-caixa { background: var(--card); border: 1px solid var(--borda); border-radius: 8px; }
  .sm-abas { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--borda); padding: 0 12px; }
  .sm-aba { border: 0; background: none; font: inherit; color: var(--texto2); padding: 12px 12px 10px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .sm-aba:hover { color: var(--texto); }
  .sm-aba[aria-selected="true"] { color: var(--primaria); font-weight: 600; border-bottom-color: var(--primaria); }
  .sm-aba .cont { font-size: 11px; font-weight: 600; background: #EEF0F3; color: var(--texto2); padding: 1px 7px; border-radius: 10px; }
  .sm-aba .cont.alerta { background: #FDE8E8; color: #A12828; }
  .sm-painel { padding: 16px 18px; }
  .sm-painel-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sm-painel-topo p { margin: 0; color: var(--texto3); font-size: 13px; }

  /* tabelas */
  .sm-tabela { overflow-x: auto; }
  .sm-tabela table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sm-tabela th { text-align: left; font-weight: 600; color: var(--texto3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; padding: 8px; border-bottom: 1px solid var(--borda); white-space: nowrap; background: #FAFBFC; }
  .sm-tabela td { padding: 7px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: middle; }

  .sm-tabela tr.marcada td { background: #FFF8F6; }
  .num { text-align: right; }
  .sm-mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--texto2); }

  /* estados e etiquetas */
  .sm-est { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #EEF0F3; color: #3A414A; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  .sm-est::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.85; }
  .e-RELEASED { background: #E6F4EA; color: #1E6B34; } .e-FROZEN { background: #E3EEFB; color: #1F4A7A; } .e-IN_WORK { background: #FDEBE2; color: #9A3E12; } .e-PRIVATE { background: #EEEAFB; color: #4B3AA3; } .e-OBSOLETE { background: #EEF0F3; color: #3A414A; }

  .t-pai { background: #FDE8E8; color: #A12828; }
  .t-parado { background: #FFF3D6; color: #7A5200; }
  .t-2d { background: #E3EEFB; color: #1F4A7A; }
  .sm-barra-est { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: #EEF0F3; }
  .c-RELEASED { background: var(--c-lib); } .c-FROZEN { background: var(--c-cong); } .c-IN_WORK { background: var(--c-trab); } .c-PRIVATE { background: var(--c-priv); } .c-OBSOLETE { background: var(--c-obs); } .c-OUTRO { background: #B4B8C0; }

  .sm-tg { width: 26px; height: 26px; border: 1px solid var(--borda-forte); border-radius: 5px; background: #fff; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--texto); flex: none; }
  .sm-tg:hover { background: #EEF2F7; }
  .sm-tg-vazio { display: inline-block; width: 26px; flex: none; }
  .sm-nome { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .sm-filhos { font-size: 11px; color: var(--texto3); }
  .sm-thumb { width: 64px; height: 48px; border: 1px solid var(--borda); border-radius: 5px; background: #F6F7F9; display: flex; align-items: center; justify-content: center; overflow: hidden; }

  .sm-tabela tr.sm-linha2d td { background: #FAFBFD; }
  .sm-link2d { border: 0; background: none; padding: 0; font: inherit; color: var(--link); text-decoration: underline; cursor: pointer; text-align: left; }
  .sm-link2d:hover { color: #123E69; }

  /* responsáveis */
  .sm-owner-g { display: grid; grid-template-columns: minmax(100px, 220px) minmax(0, 1fr) 48px 90px; gap: 10px 14px; align-items: center; font-size: 13px; }
  .sm-owner-g .cab { font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
  .sm-owner-b { height: 10px; background: #EEF0F3; border-radius: 5px; }
  .sm-owner-b div { height: 10px; background: #4A6E93; border-radius: 5px; }

  /* janela de detalhes */
  .sm-modal-fundo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,32,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .sm-modal { background: #fff; border-radius: 10px; width: 100%; max-width: 680px; max-height: 100%; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 16px 48px rgba(0,0,0,0.25); }
  .sm-modal-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sm-modal-topo h2 { margin: 0; font-size: 18px; font-weight: 600; word-break: break-word; }
  .sm-fechar { width: 36px; height: 36px; border: 1px solid var(--borda-forte); border-radius: 6px; background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--texto); }
  .sm-modal-img { background: #F6F7F9; border: 1px solid var(--borda); border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 240px; padding: 12px; }
  .sm-modal-img img { width: 432px; max-width: 100%; height: auto; }
  .sm-modal-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sm-modal-msg { font-size: 13px; }

  /* mensagens e textos auxiliares */
  .sm-aviso { background: #FFF8E6; border: 1px solid #F0D79A; border-radius: 8px; padding: 12px 14px; color: #5C4300; }
  .sm-erro { background: #FDF3F2; border: 1px solid #E8B4AD; border-radius: 8px; padding: 12px 14px; color: #7E2318; }
  .sm-vazio { color: var(--texto3); font-size: 13px; }
  .sm-nota { font-size: 12px; color: var(--texto3); margin: 10px 0 0; }
  .sm-def { margin: 10px 0 0; display: grid; grid-template-columns: minmax(140px, 200px) minmax(0, 1fr); gap: 6px 14px; font-size: 13px; color: var(--texto2); }
  .sm-def dt { font-weight: 600; color: var(--texto); }
  .sm-def dd { margin: 0; }
  .sm-rodape { display: flex; flex-direction: column; gap: 8px; }
  .sm-diag { background: transparent; border: 0; padding: 0; }
  .sm-diag summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--texto2); min-height: 24px; }
  .sm-log { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .sm-log li { padding: 3px 0; }
  .sm-diag textarea { width: 100%; height: 180px; font-family: Consolas, monospace; font-size: 12px; border: 1px solid var(--borda-forte); border-radius: 6px; padding: 8px; margin-top: 8px; }
  .sm-inicio { background: var(--card); border: 1px dashed var(--borda-forte); border-radius: 8px; padding: 40px 20px; text-align: center; color: var(--texto2); }
  .sm-inicio strong { display: block; font-size: 16px; color: var(--texto); margin-bottom: 4px; }
  @media (max-width: 640px) { .sm-corpo, .sm-barra, .sm-topo, .sm-config { padding-left: 12px; padding-right: 12px; } .sm-meta-dados { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sm-owner-g { grid-template-columns: minmax(80px, 1fr) minmax(0, 1fr) 40px; } .sm-owner-g .so-larga { display: none; } }
</style>

  // App da 3DX usado para ver o item em 3D (3DPlay).
  // X3DPLAW_AP = 3DPlay web (o que abre dentro do dashboard). Abre peças, montagens e desenhos.
  var APP_3D = 'X3DPLAW_AP';
  var ICONE_X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var noModal = null;

  // ---------- utilidades ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function rotulo(s) { return ROTULOS[s] || s || '(sem estado)'; }
  function classeEst(s) { return ROTULOS[s] ? s : 'OUTRO'; }
  function textoErro(e) {
    if (!e) return 'erro desconhecido';
    if (e.message) return e.message;
    try { return JSON.stringify(e).slice(0, 500); } catch (x) { return String(e); }
  }
  function diasDesde(data) {
    var t = Date.parse(data);
    if (isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
  function dataBR(v) {
    var t = Date.parse(v);
    if (isNaN(t)) return v || '';
    var d = new Date(t);
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function agora() {
    var d = new Date();
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getHours()) + ':' + z(d.getMinutes()) + ' · ' + z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function lerLocal(chave) { try { return window.localStorage.getItem(chave) || ''; } catch (x) { return ''; } }
  function gravarLocal(chave, v) { try { window.localStorage.setItem(chave, v); } catch (x) { } }

  function anotar(etapa, situacao, detalhe) {
    var existente = null;
    for (var i = 0; i < registro.length; i++) { if (registro[i].etapa === etapa) existente = registro[i]; }
    if (existente) { existente.situacao = situacao; existente.detalhe = detalhe || ''; }
    else registro.push({ etapa: etapa, situacao: situacao, detalhe: detalhe || '' });
    var html = '';
    registro.forEach(function (r) { html += '<li><strong>' + esc(r.situacao) + '</strong> · ' + esc(r.etapa) + (r.detalhe ? ' · ' + esc(r.detalhe) : '') + '</li>'; });
    if ($('sm-log')) $('sm-log').innerHTML = html;
    if ($('sm-diag')) {
      $('sm-diag').value = JSON.stringify({ versao: VERSAO, navegador: navigator.userAgent, space: estado.spaceUrl, contexto: estado.ctx, etapas: registro, amostra: amostra }, null, 2);
    }
  }

  function mostrarAviso(html, tipo) {
    if (!$('sm-aviso')) return;
    $('sm-aviso').innerHTML = html ? '<div class="' + (tipo === 'erro' ? 'sm-erro' : 'sm-aviso') + '">' + html + '</div>' : '';
  }

  function requisicao(metodo, url, corpo) {
    return new Promise(function (resolve, reject) {
      var headers = { 'Accept': 'application/json' };
      if (estado.ctx) headers['SecurityContext'] = estado.ctx;
      if (corpo) headers['Content-Type'] = 'application/json';
      if (metodo !== 'GET' && estado.csrf) headers[estado.csrf.name] = estado.csrf.value;
      WAF.authenticatedRequest(url, {
        method: metodo, headers: headers, data: corpo ? JSON.stringify(corpo) : undefined, type: 'json', timeout: 180000,
        onComplete: function (r) { if (typeof r === 'string') { try { r = JSON.parse(r); } catch (x) { } } resolve(r); },
        onFailure: function (err, resp) {
          var extra = '';
          if (resp) { try { extra = ' | resposta: ' + (typeof resp === 'string' ? resp : JSON.stringify(resp)).slice(0, 500); } catch (x) { } }
          reject(new Error(textoErro(err) + extra));
        },
        onTimeout: function () { reject(new Error('tempo esgotado')); }
      });
    });
  }
  function comTempo(promessa, ms, nome) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error(nome + ': sem resposta em ' + (ms / 1000) + 's')); }, ms);
      promessa.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  // Chamada à busca da 3DX (3DSearch). Tenta formas diferentes e guarda a que funcionou.
  var FED_VARIANTES = [
    { nome: 'simples', ctx: false, extra: {} },
    { nome: 'passport', ctx: false, extra: { proxy: 'passport' } },
    { nome: 'com contexto', ctx: true, extra: {} }
  ];
  var fedVariante = -1;
  function chamarFed(url, corpo, v) {
    return new Promise(function (resolve, reject) {
      var headers = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
      if (v.ctx && estado.ctx) headers.SecurityContext = estado.ctx;
      var o = {
        method: 'POST', headers: headers, data: JSON.stringify(corpo), type: 'json', timeout: 30000,
        onComplete: function (r) { if (typeof r === 'string') { try { r = JSON.parse(r); } catch (x) { } } resolve(r); },
        onFailure: function (err, resp) {
          var extra = '';
          if (resp) { try { extra = ' | resposta: ' + (typeof resp === 'string' ? resp : JSON.stringify(resp)).slice(0, 300); } catch (x) { } }
          reject(new Error(textoErro(err) + extra));
        },
        onTimeout: function () { reject(new Error('tempo esgotado')); }
      };
      for (var k in v.extra) o[k] = v.extra[k];
      WAF.authenticatedRequest(url, o);
    });
  }
  function buscaFed(url, corpo) {
    if (fedVariante >= 0) return comTempo(chamarFed(url, corpo, FED_VARIANTES[fedVariante]), 35000, 'busca de imagens');
    amostra.thumbsTentativas = [];
    function tentar(i) {
      if (i >= FED_VARIANTES.length) return Promise.reject(new Error('nenhuma forma de chamar a busca de imagens funcionou'));
      var v = FED_VARIANTES[i];
      return comTempo(chamarFed(url, corpo, v), 35000, v.nome).then(function (r) {
        if (!r || !r.results) throw new Error('resposta sem "results": ' + String(JSON.stringify(r)).slice(0, 200));
        amostra.thumbsTentativas.push(v.nome + ': OK, ' + r.results.length + ' resultado(s)');
        fedVariante = i;
        return r;
      }).catch(function (e) {
        amostra.thumbsTentativas.push(v.nome + ': ' + textoErro(e));
        return tentar(i + 1);
      });
    }
    return tentar(0);
  }

  // ---------- conexão ----------
  function lerSpaceDoLink() {
    try { var m = /[?&]space=([^&#]+)/.exec(window.location.search || ''); return m ? decodeURIComponent(m[1]) : ''; } catch (x) { return ''; }
  }

  function conectar() {
    var origem = '', endereco = '';
    if ((endereco = lerSpaceDoLink())) origem = 'do link';
    else if ((endereco = lerLocal('sm-space'))) origem = 'salvo';
    else { endereco = SPACE_PADRAO; origem = 'padrão'; }
    anotar('Endereço do 3DSpace', 'OK', origem + ' · ' + endereco);
    continuarConexao(endereco);
  }

  function continuarConexao(endereco) {
    estado.spaceUrl = String(endereco).replace(/\/+$/, '');
    anotar('Usuário e contexto', '...');
    comTempo(requisicao('GET', estado.spaceUrl + '/resources/modeler/pno/person?current=true&select=preferredcredentials&select=collabspaces'), 30000, 'dados do usuário')
    .then(function (pessoa) {
      var pc = pessoa && pessoa.preferredcredentials;
      if (pc && pc.role && pc.organization && pc.collabspace) {
        estado.ctx = 'ctx::' + pc.role.name + '.' + pc.organization.name + '.' + pc.collabspace.name;
      } else if (pessoa && pessoa.collabspaces && pessoa.collabspaces.length && pessoa.collabspaces[0].couples && pessoa.collabspaces[0].couples.length) {
        var cs = pessoa.collabspaces[0], c = cs.couples[0];
        estado.ctx = 'ctx::' + c.role.name + '.' + c.organization.name + '.' + cs.name;
      } else {
        throw new Error('não encontrei credenciais do usuário');
      }
      estado.usuario = pessoa.name || '';
      anotar('Usuário e contexto', 'OK', estado.usuario + ' · ' + estado.ctx);
      anotar('Token CSRF', '...');
      return comTempo(requisicao('GET', estado.spaceUrl + '/resources/v1/application/CSRF'), 30000, 'token CSRF');
    }).then(function (r) {
      if (!r || !r.csrf || !r.csrf.name) throw new Error('resposta sem token');
      estado.csrf = r.csrf;
      conectado = true;
      gravarLocal('sm-space', estado.spaceUrl);
      anotar('Token CSRF', 'OK');
      $('sm-conexao').textContent = estado.usuario + ' · ' + estado.ctx.replace('ctx::', '');
      $('sm-buscar').disabled = false;
      mostrarAviso('');
      var ultima = lerLocal('sm-ultima');
      if (ultima && !$('sm-nome').value) $('sm-nome').value = ultima;
    }).catch(function (e) {
      anotar('Conexão', 'ERRO', textoErro(e));
      gravarLocal('sm-space', '');
      $('sm-conexao').textContent = 'Sem conexão';
      pedirSpaceManual(textoErro(e));
    });
  }

  function pedirSpaceManual(motivo) {
    mostrarAviso(
      '<strong>Não consegui conectar ao 3DSpace.</strong> ' + esc(motivo) +
      '<div style="margin-top:8px">Cole o endereço do 3DSpace do seu tenant (algo como <code>https://xxxx-us1-space.3dexperience.3ds.com/enovia</code>) e clique em Usar.</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
      '<input id="sm-space" type="text" aria-label="Endereço do 3DSpace" style="height:36px;min-width:360px;padding:0 8px;border:1px solid #C3C9D1;border-radius:4px" />' +
      '<button type="button" class="sm-btn2" id="sm-usar">Usar</button></div>');
    $('sm-usar').addEventListener('click', function () {
      var v = ($('sm-space').value || '').trim();
      if (!v) return;
      mostrarAviso('');
      continuarConexao(v);
    });
  }

  // ---------- busca e leitura ----------
  function buscar() {
    var termo = ($('sm-nome').value || '').trim();
    if (!termo || !conectado) return;
    gravarLocal('sm-ultima', termo);
    $('sm-buscar').disabled = true;
    mostrarAviso('');
    $('sm-conteudo').innerHTML = '<p class="sm-vazio">Buscando "' + esc(termo) + '"...</p>';
    anotar('Busca', '...', termo);
    var url = estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/search?$searchStr=' + encodeURIComponent(termo) + '&$top=30';
    requisicao('GET', url).then(function (r) {
      var membros = (r && r.member) || [];
      amostra.busca = { total: r && r.totalItems, primeiros: membros.slice(0, 3) };
      if (!membros.length) throw new Error('nenhum item encontrado com "' + termo + '"');
      var exato = null;
      membros.forEach(function (m) { if (!exato && (m.name === termo || m.title === termo)) exato = m; });
      anotar('Busca', 'OK', membros.length + ' encontrado(s)');
      if (exato || membros.length === 1) { ler(exato || membros[0]); return; }
      mostrarEscolha(membros);
      $('sm-buscar').disabled = false;
    }).catch(function (e) {
      anotar('Busca', 'ERRO', textoErro(e));
      $('sm-conteudo').innerHTML = '';
      mostrarAviso(esc(textoErro(e)), 'erro');
      $('sm-buscar').disabled = false;
    });
  }

  function mostrarEscolha(membros) {
    encontrados = membros;
    var html = '<div class="sm-caixa"><h3>Encontrei ' + membros.length + ' itens. Qual montagem você quer ver?</h3>' +
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">';
    membros.forEach(function (m, i) {
      html += '<button type="button" class="sm-btn2 sm-escolha" data-i="' + i + '" style="text-align:left;height:auto;min-height:36px;padding:6px 12px">' +
        '<strong>' + esc(m.title) + '</strong> · <span class="sm-mono">' + esc(m.name) + '</span> · rev. ' + esc(m.revision) +
        ' · <span class="sm-est e-' + esc(m.state) + '">' + esc(rotulo(m.state)) + '</span></button>';
    });
    html += '</div></div>';
    $('sm-conteudo').innerHTML = html;
  }

  function ler(raiz) {
    $('sm-buscar').disabled = true;
    $('sm-atualizar').disabled = true;
    $('sm-conteudo').innerHTML = '<p class="sm-vazio">Lendo a estrutura de <strong>' + esc(raiz.title || raiz.name) + '</strong>. Em montagens grandes isso pode levar alguns segundos...</p>';
    anotar('Expansão', '...', (raiz.name || '') + ' "' + (raiz.title || '') + '"');
    requisicao('POST', estado.spaceUrl + '/resources/v1/modeler/dseng/dseng:EngItem/' + encodeURIComponent(raiz.id) + '/expand', { expandDepth: -1, withPath: true })
    .then(function (r) {
      var membros = (r && r.member) || [];
      bruto = { raiz: raiz, membros: membros, lido: agora() };
      aberto = {};
      thumbs = {}; thumbsEstado = '';
      desenhos = {}; desenhosEstado = ''; desenhosLista = {};
      processar();
      anotar('Expansão', 'OK', dados.unicos.length + ' itens únicos, ' + dados.nos.length + ' ocorrências');
      desenhar();
      carregarThumbs();
      carregarDesenhos();
    }).catch(function (e) {
      anotar('Expansão', 'ERRO', textoErro(e));
      $('sm-conteudo').innerHTML = '';
      mostrarAviso('Não consegui ler a estrutura: ' + esc(textoErro(e)), 'erro');
    }).then(function () {
      $('sm-buscar').disabled = false;
      $('sm-atualizar').disabled = !bruto;
      $('sm-exportar').disabled = !dados;
    });
  }

  // ---------- thumbnails (via 3DSearch, que devolve o preview_url de cada item) ----------
  function carregarThumbs() {
    if (!dados) return;
    var m = /^(https:\/\/)([a-z0-9]+)(-[a-z0-9]+)-space\.(.*?)\/enovia/i.exec(estado.spaceUrl || '');
    if (!m) { thumbsEstado = 'erro'; anotar('Thumbnails', 'ERRO', 'não reconheci o endereço do 3DSpace'); desenharArvore(); return; }
    var tenant = m[2].toUpperCase();
    var urlBusca = m[1] + m[2] + m[3] + '-fedsearch.' + m[4] + '/federated/search?xrequestedwith=xmlhttprequest&tenant=' + tenant;
    var nomes = [];
    dados.unicos.forEach(function (u) { if (u.item.name && !(u.item.name in thumbs)) nomes.push(u.item.name); });
    if (dados.raiz.item.name && !(dados.raiz.item.name in thumbs)) nomes.push(dados.raiz.item.name);
    if (!nomes.length) { thumbsEstado = 'ok'; desenharArvore(); return; }
    thumbsEstado = 'carregando';
    anotar('Thumbnails', '...', nomes.length + ' itens');
    var lotes = [];
    for (var i = 0; i < nomes.length; i += 25) lotes.push(nomes.slice(i, i + 25));
    var falhas = 0;
    function processarLote(lote) {
      var corpo = {
        label: 'sm-thumbs', locale: 'en', select_predicate: ['ds6w:identifier', 'preview_url'],
        with_indexing_date: false, with_nls: false, with_synthesis: false,
        query: lote.join(' OR '), refine: {}, order_by: 'desc', order_field: 'relevance',
        nresults: 100, start: '0', source: ['3dspace'], tenant: tenant,
        login: { '3dspace': { SecurityContext: estado.ctx } }
      };
      return buscaFed(urlBusca, corpo).then(function (r) {
        if (!amostra.thumbsAmostra && r && r.results && r.results[0]) {
          amostra.thumbsAmostra = (r.results[0].attributes || []).map(function (x) { return x.name; });
        }
        (r && r.results || []).forEach(function (res) {
          var a = {};
          (res.attributes || []).forEach(function (x) { a[x.name] = x.value; });
          var id = a['ds6w:identifier'];
          if (id && lote.indexOf(id) >= 0 && a.preview_url) thumbs[id] = a.preview_url;
        });
        lote.forEach(function (n) { if (!(n in thumbs)) thumbs[n] = ''; });
      }).catch(function (e) { falhas++; amostra.erroThumbs = textoErro(e); });
    }
    // o primeiro lote descobre a forma de chamada que funciona; os demais vão em paralelo
    processarLote(lotes[0]).then(function () {
      return Promise.all(lotes.slice(1).map(processarLote));
    }).then(function () {
      thumbsEstado = falhas === lotes.length ? 'erro' : 'ok';
      anotar('Thumbnails', falhas ? (falhas === lotes.length ? 'ERRO' : 'OK') : 'OK', falhas ? falhas + ' de ' + lotes.length + ' lote(s) falharam' : '');
      desenhar();
    });
  }

  // ---------- desenhos ----------
  // 1) a busca da 3DX acha os desenhos (tipo Drawing) cujo rótulo é o título-base das peças;
  // 2) o detalhe de cada desenho (API de CAD) diz exatamente qual item ele detalha.
  var ORDEM_DES = { RELEASED: 3, FROZEN: 2, IN_WORK: 1, PRIVATE: 0 };

  function tituloBase(t) { return String(t || '').replace(/\s*\([^()]*\)\s*$/, '').trim(); }

  function infoFed() {
    var m = /^(https:\/\/)([a-z0-9]+)(-[a-z0-9]+)-space\.(.*?)\/enovia/i.exec(estado.spaceUrl || '');
    if (!m) return null;
    var tenant = m[2].toUpperCase();
    return { tenant: tenant, url: m[1] + m[2] + m[3] + '-fedsearch.' + m[4] + '/federated/search?xrequestedwith=xmlhttprequest&tenant=' + tenant };
  }

  function carregarDesenhos() {
    if (!dados) return;
    var f = infoFed();
    if (!f) { desenhosEstado = 'erro'; anotar('Desenhos', 'ERRO', 'não reconheci o endereço do 3DSpace'); desenhar(); return; }
    var itens = dados.unicos.map(function (u) { return u.item; }).concat([dados.raiz.item]);
    var rotulos = [];
    itens.forEach(function (it) { var b = tituloBase(it.title || it.name).replace(/"/g, ''); if (b && rotulos.indexOf(b) < 0) rotulos.push(b); });
    desenhosEstado = 'carregando';
    anotar('Desenhos', '...', rotulos.length + ' títulos');
    var lotes = [];
    for (var i = 0; i < rotulos.length; i += 20) lotes.push(rotulos.slice(i, i + 20));
    var achados = {}, falhas = 0;
    function buscarLote(lote) {
      var corpo = {
        label: 'sm-desenhos', locale: 'en', select_predicate: ['ds6w:identifier', 'physicalid'],
        with_indexing_date: false, with_nls: false, with_synthesis: false,
        query: '[ds6w:type]:"Drawing" AND (' + lote.map(function (l) { return '[ds6w:label]:"' + l + '"'; }).join(' OR ') + ')',
        refine: {}, order_by: 'desc', order_field: 'relevance', nresults: 200, start: '0', source: ['3dspace'], tenant: f.tenant,
        login: { '3dspace': { SecurityContext: estado.ctx } }
      };
      return buscaFed(f.url, corpo).then(function (r) {
        (r && r.results || []).forEach(function (res) {
          var a = {};
          (res.attributes || []).forEach(function (x) { a[x.name] = x.value; });
          if (a.physicalid) achados[a.physicalid] = a['ds6w:identifier'] || '';
        });
      }).catch(function (e) { falhas++; amostra.erroDesenhos = textoErro(e); });
    }
    function detalhar(id) {
      return requisicao('GET', estado.spaceUrl + '/resources/v1/modeler/dsxcad/dsxcad:Drawing/' + encodeURIComponent(id) + '?$mask=dsmvxcad:xCADDrawingMask.Details')
        .then(function (r) {
          var d = r && r.member && r.member[0];
          if (!d) return;
          ((d.relatedData || {}).member || []).forEach(function (l) {
            var alvo = l.referencedObject && l.referencedObject.id;
            if (!alvo) return;
            var atual = desenhos[alvo];
            if (!atual || (ORDEM_DES[d.state] || 0) > (ORDEM_DES[atual.state] || 0)) desenhos[alvo] = { state: d.state, name: d.name, title: d.title };
            var lista = desenhosLista[alvo] || (desenhosLista[alvo] = []);
            if (!lista.some(function (x) { return x.id === id; })) {
              lista.push({ id: id, name: d.name, title: d.title, state: d.state, revision: d.revision, owner: d.owner, modified: d.modified, type: d.type || 'Drawing' });
            }
          });
        }).catch(function (e) { falhas++; amostra.erroDesenhoDetalhe = textoErro(e); });
    }
    var cadeia = lotes.length ? buscarLote(lotes[0]).then(function () { return Promise.all(lotes.slice(1).map(buscarLote)); }) : Promise.resolve();
    cadeia.then(function () {
      var ids = Object.keys(achados);
      amostra.desenhosAchados = ids.length;
      // detalha de 6 em 6 para não sobrecarregar a 3DX
      var grupos = [];
      for (var g = 0; g < ids.length; g += 6) grupos.push(ids.slice(g, g + 6));
      return grupos.reduce(function (p, grupo) { return p.then(function () { return Promise.all(grupo.map(detalhar)); }); }, Promise.resolve());
    }).then(function () {
      desenhosEstado = falhas && !Object.keys(desenhos).length ? 'erro' : 'ok';
      anotar('Desenhos', desenhosEstado === 'erro' ? 'ERRO' : 'OK', Object.keys(desenhos).length + ' item(ns) com desenho' + (falhas ? ' · ' + falhas + ' falha(s)' : ''));
      desenhar();
    });
  }

  // situação do desenho de um item: 'RELEASED', 'IN_WORK'..., 'FALTA', ou null enquanto carrega
  function statusDesenho(item) {
    if (desenhosEstado === 'ok') return desenhos[item.id] ? desenhos[item.id].state : 'FALTA';
    if (desenhosEstado === 'erro') return 'ERRO';
    return null;
  }

  function tagDesenho(item) {
    var s = statusDesenho(item);
    if (s === null) return '<span class="sm-vazio">...</span>';
    if (s === 'ERRO') return '<span class="sm-vazio">erro</span>';
    if (s === 'FALTA') return '<span class="sm-tag t-pai">falta</span>';
    return '<span class="sm-est e-' + esc(s) + '">' + esc(rotulo(s)) + '</span>';
  }

  function resumoDesenhos() {
    var itens = dados.unicos.map(function (u) { return u.item; }).concat([dados.raiz.item]);
    var r = { total: itens.length, lib: 0, naoLib: 0, sem: 0 };
    itens.forEach(function (it) {
      var s = statusDesenho(it);
      if (s === 'RELEASED') r.lib++; else if (s === 'FALTA') r.sem++; else if (s) r.naoLib++;
    });
    r.faltam = r.sem + r.naoLib;
    return r;
  }

  // itens que pedem ação: parados, pendentes sob pai liberado e liberados sem desenho liberado
  function listaAcao() {
    var lista = [], porId = {};
    dados.acao.forEach(function (u) { var e = { u: u, semDes: false }; lista.push(e); porId[u.item.id] = e; });
    if (desenhosEstado === 'ok') {
      var r = dados.raiz.item;
      dados.unicos.concat([{ item: r, dias: diasDesde(r.modified), pais: {}, parado: false, paiLiberado: false }]).forEach(function (u) {
        if (u.item.state === 'RELEASED' && statusDesenho(u.item) !== 'RELEASED') {
          if (porId[u.item.id]) porId[u.item.id].semDes = true;
          else { var e = { u: u, semDes: true }; lista.push(e); porId[u.item.id] = e; }
        }
      });
    }
    function peso(e) { return (e.u.paiLiberado ? 2 : 0) + (e.semDes ? 2 : 0) + (e.u.parado ? 1 : 0); }
    return lista.sort(function (a, b) { return peso(b) - peso(a) || (b.u.dias || 0) - (a.u.dias || 0); });
  }

  function celulaThumb(item, idx) {
    var url = thumbs[item.name], miolo;
    if (url) miolo = '<div class="sm-thumb"><img src="' + esc(url) + '" alt="" loading="lazy" /></div>';
    else {
      var txt = thumbsEstado === 'carregando' && !(item.name in thumbs) ? '...' : (thumbsEstado === 'erro' ? 'erro' : 'sem imagem');
      miolo = '<div class="sm-thumb vazio">' + txt + '</div>';
    }
    return '<button type="button" class="sm-thumb-btn" data-idx="' + idx + '" aria-label="Ver detalhes de ' + esc(item.title || item.name) + '">' + miolo + '</button>';
  }

  // ---------- janela de detalhes do item ----------
  function noPorIdx(idx) {
    if (!dados) return null;
    if (idx === 0) return dados.raiz;
    for (var i = 0; i < dados.nos.length; i++) if (dados.nos[i].idx === idx) return dados.nos[i];
    return null;
  }

  function abrirModal(idx) {
    var n = noPorIdx(idx);
    if (!n) return;
    noModal = n;
    var it = n.item, url = thumbs[it.name];
    var alertas = [];
    if (n.temFilhoPendente) alertas.push('<span class="sm-tag t-pai">filho pendente</span>');
    if (n.paiLiberado) alertas.push('<span class="sm-tag t-pai">pai liberado</span>');
    if (n.parado) alertas.push('<span class="sm-tag t-parado">parado</span>');
    $('sm-modal').innerHTML =
      '<div class="sm-modal-fundo" id="sm-modal-fundo">' +
        '<div class="sm-modal" role="dialog" aria-modal="true" aria-labelledby="sm-modal-titulo">' +
          '<div class="sm-modal-topo"><h2 id="sm-modal-titulo">' + esc(it.title || it.name) + '</h2>' +
            '<button type="button" class="sm-fechar" id="sm-modal-fechar" aria-label="Fechar">' + ICONE_X + '</button></div>' +
          '<div class="sm-modal-img">' + (url ? '<img src="' + esc(url) + '" alt="Pré-visualização de ' + esc(it.title || it.name) + '" />' : '<span class="sm-vazio">Sem imagem de pré-visualização na 3DX.</span>') + '</div>' +
          '<dl class="sm-def" style="margin:0">' +
            '<dt>Item</dt><dd class="sm-mono">' + esc(it.name) + '</dd>' +
            '<dt>Revisão</dt><dd>' + esc(it.revision) + '</dd>' +
            '<dt>Estado</dt><dd><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></dd>' +
            '<dt>Owner</dt><dd>' + esc(it.owner) + '</dd>' +
            '<dt>Modificado</dt><dd>' + esc(dataBR(it.modified)) + (n.dias === null || n.dias === undefined ? '' : ' · ' + n.dias + ' dia(s) sem alteração') + '</dd>' +
            '<dt>Desenho</dt><dd>' + tagDesenho(it) + (desenhos[it.id] ? ' <span class="sm-mono">' + esc(desenhos[it.id].name) + '</span>' : '') + '</dd>' +
            '<dt>Nível</dt><dd>' + n.nivel + (n.filhos.length ? ' · ' + n.filhos.length + ' filho(s)' : '') + '</dd>' +
            (alertas.length ? '<dt>Alertas</dt><dd>' + alertas.join(' ') + '</dd>' : '') +
          '</dl>' +
          '<div class="sm-modal-acoes"><button type="button" class="sm-btn" id="sm-modal-3d">Ver em 3D (3DPlay)</button>' +
            (melhorDesenho(it.id) ? '<button type="button" class="sm-btn" id="sm-modal-2d">Ver desenho (2D)</button>' : '') +
            '<button type="button" class="sm-btn2" id="sm-modal-fechar2">Fechar</button></div>' +
          '<div class="sm-modal-msg" id="sm-modal-msg"><span class="sm-vazio">Abre no 3DPlay da plataforma, numa nova aba, onde dá para girar, dar zoom e medir.</span></div>' +
        '</div></div>';
    $('sm-modal-fechar').focus();
  }

  function fecharModal() { noModal = null; if ($('sm-modal')) $('sm-modal').innerHTML = ''; }

  // link da plataforma que abre um app já com o item carregado (protocolo 3DXContent)
  function linkApp(appId, it) {
    var f = infoFed();
    if (!f) return null;
    var dash = estado.spaceUrl.replace('-space.', '-ifwe.').replace(/\/enovia\/?$/, '');
    var conteudo = {
      protocol: '3DXContent', version: '1.1', source: appId, widgetId: '',
      data: { items: [{ envId: f.tenant, serviceId: '3DSpace', contextId: estado.ctx, objectId: it.id, objectType: it.type || 'VPMReference', displayName: it.title || it.name, displayType: it.type === 'Drawing' ? 'Drawing' : 'Physical Product' }] }
    };
    return dash + '/#app:' + appId + '/content:X3DContentId=' + encodeURIComponent(JSON.stringify(conteudo));
  }

  // abre um item ou desenho no 3DPlay numa nova aba; devolve o html da mensagem para mostrar
  function abrirPorLink(obj, rotuloObj) {
    var url = linkApp(APP_3D, obj);
    if (!url) { anotar('Abrir no 3DPlay', 'ERRO', 'não montei o link'); return '<div class="sm-erro">Não consegui montar o link do 3DPlay.</div>'; }
    var janela = null;
    try { janela = window.open(url, '_blank'); } catch (x) { }
    anotar('Abrir no 3DPlay', 'OK', rotuloObj + ' · ' + (obj.name || ''));
    return janela
      ? '<div class="sm-aviso">Abri ' + esc(rotuloObj) + ' no 3DPlay numa nova aba.</div>'
      : '<div class="sm-aviso">O navegador bloqueou a nova aba. <a href="' + esc(url) + '" target="_blank" rel="noopener">Clique aqui para abrir no 3DPlay</a>.</div>';
  }

  function melhorDesenho(itemId) {
    var lista = (desenhosLista[itemId] || []).slice();
    lista.sort(function (a, b) { return (ORDEM_DES[b.state] || 0) - (ORDEM_DES[a.state] || 0); });
    return lista[0] || null;
  }

  function abrir2D(d) {
    if (!d) return;
    var html = abrirPorLink({ id: d.id, type: 'Drawing', title: d.title, name: d.name }, 'o desenho');
    if ($('sm-modal-msg')) $('sm-modal-msg').innerHTML = html;
  }

  function abrir3D() {
    if (!noModal) return;
    var it = noModal.item, feito = false;
    function msg(html) { if ($('sm-modal-msg')) $('sm-modal-msg').innerHTML = html; }
    function porLink(motivo) {
      if (feito) return; feito = true;
      msg(abrirPorLink(it, 'o item em 3D'));
    }
    // janela da própria 3DX por cima do dashboard, quando o módulo existe aqui; senão, nova aba pelo link
    if (moduloJanelas && moduloJanelas.showWidget) {
      try {
        moduloJanelas.showWidget(APP_3D, it.title || it.name, {
          input: { asset: { physicalid: it.id, dtype: it.type || 'VPMReference', provider: 'EV6', serviceId: '3DSpace', contextId: estado.ctx } }
        });
        feito = true;
        anotar('Abrir em 3D', 'OK', 'janela da 3DX · ' + it.name);
        fecharModal();
        return;
      } catch (e) { /* cai para o link */ }
    }
    porLink(moduloJanelas === false ? 'módulo de janelas indisponível' : 'sem janela da 3DX');
  }

  // verifica uma vez, na abertura, se o módulo de janelas da 3DX existe dentro do widget
  var moduloJanelas = null;
  function verificarModuloJanelas() {
    if (typeof require !== 'function') { moduloJanelas = false; return; }
    try {
      require(['DS/TransientWidget/TransientWidget'], function (TW) { moduloJanelas = TW || false; amostra.moduloJanelas = !!TW; },
        function () { moduloJanelas = false; amostra.moduloJanelas = false; });
    } catch (e) { moduloJanelas = false; }
  }

  // ---------- processamento ----------
  function processar() {
    var raiz = bruto.raiz, membros = bruto.membros;
    var refs = {}, caminhos = [], porTipo = {};
    membros.forEach(function (m) {
      var p = m.Path || m.path;
      var tipo = Array.isArray(p) ? '(Path)' : (m.type || '?');
      porTipo[tipo] = (porTipo[tipo] || 0) + 1;
      if (Array.isArray(p)) { caminhos.push(p); return; }
      if (/instance/i.test(m.type || '')) return;
      if (m.id) refs[m.id] = m;
    });
    amostra.expansao = { total: membros.length, porTipo: porTipo };
    if (!refs[raiz.id]) refs[raiz.id] = raiz;

    var limite = cfg.limite;
    var raizNo = { idx: 0, chave: raiz.id, item: refs[raiz.id], nivel: 0, filhos: [], pai: null };
    var porChave = {}; porChave[raiz.id] = raizNo;
    var nos = [];

    function novoNo(chave, item, nivel, pai) {
      var no = { idx: nos.length + 1, chave: chave, item: item, nivel: nivel, filhos: [], pai: pai };
      porChave[chave] = no; pai.filhos.push(no); nos.push(no);
      return no;
    }

    if (caminhos.length) {
      // A 3DX devolve os caminhos até as folhas; as submontagens aparecem no meio.
      caminhos.forEach(function (p) {
        for (var L = 3; L <= p.length; L += 2) {
          var chave = p.slice(0, L).join('/');
          if (porChave[chave]) continue;
          var ref = refs[p[L - 1]];
          var pai = porChave[p.slice(0, L - 2).join('/')];
          if (!ref || !pai) continue;
          novoNo(chave, ref, (L - 1) / 2, pai);
        }
      });
    } else {
      Object.keys(refs).forEach(function (id) { if (id !== raiz.id) novoNo(raiz.id + '/' + id, refs[id], 1, raizNo); });
    }

    // sinais por ocorrência e por item único
    var unicosMapa = {};
    nos.forEach(function (no) {
      var s = no.item.state;
      no.dias = diasDesde(no.item.modified);
      no.parado = (s === 'IN_WORK' || s === 'PRIVATE') && no.dias !== null && no.dias >= limite;
      no.paiLiberado = no.pai && no.pai.item && no.pai.item.state === 'RELEASED' && s !== 'RELEASED' && s !== 'OBSOLETE';
      var u = unicosMapa[no.item.id];
      if (!u) { u = unicosMapa[no.item.id] = { item: no.item, dias: no.dias, parado: false, paiLiberado: false, ocorrencias: 0, pais: {} }; }
      u.ocorrencias++;
      if (no.parado) u.parado = true;
      if (no.paiLiberado) { u.paiLiberado = true; u.pais[no.pai.item.title || no.pai.item.name] = true; }
    });
    // pais com filhos pendentes
    nos.forEach(function (no) {
      no.temFilhoPendente = no.item.state === 'RELEASED' && no.filhos.some(function (f) { return f.paiLiberado; });
    });
    var unicos = Object.keys(unicosMapa).filter(function (id) { return id !== raiz.id; }).map(function (id) { return unicosMapa[id]; });

    var porEstado = {};
    unicos.forEach(function (u) { var s = u.item.state || '?'; porEstado[s] = (porEstado[s] || 0) + 1; });

    // submontagens do 1º nível
    var subs = raizNo.filhos.filter(function (n) { return n.filhos.length; }).map(function (n) {
      var vistos = {}, cont = {}, total = 0, parados = 0, pai = 0;
      (function percorrer(x) {
        x.filhos.forEach(function (f) {
          if (!vistos[f.item.id]) {
            vistos[f.item.id] = true; total++;
            var s = f.item.state || '?'; cont[s] = (cont[s] || 0) + 1;
            if (unicosMapa[f.item.id].parado) parados++;
            if (unicosMapa[f.item.id].paiLiberado) pai++;
          }
          percorrer(f);
        });
      })(n);
      return { no: n, total: total, cont: cont, parados: parados, pai: pai, ids: Object.keys(vistos) };
    });

    // pendências por owner
    var owners = {};
    unicos.forEach(function (u) {
      var s = u.item.state;
      if (s === 'RELEASED' || s === 'OBSOLETE') return;
      var o = u.item.owner || '(sem owner)';
      if (!owners[o]) owners[o] = { owner: o, total: 0, parados: 0 };
      owners[o].total++; if (u.parado) owners[o].parados++;
    });
    var listaOwners = Object.keys(owners).map(function (k) { return owners[k]; }).sort(function (a, b) { return b.total - a.total; });

    // itens que pedem ação
    var acao = unicos.filter(function (u) { return u.parado || u.paiLiberado; }).sort(function (a, b) {
      if (a.paiLiberado !== b.paiLiberado) return a.paiLiberado ? -1 : 1;
      return (b.dias || 0) - (a.dias || 0);
    });

    dados = {
      raiz: raizNo, nos: nos, unicos: unicos, porEstado: porEstado, subs: subs, owners: listaOwners, acao: acao,
      parados: unicos.filter(function (u) { return u.parado; }).length,
      paiLib: unicos.filter(function (u) { return u.paiLiberado; }).length,
      paisComPendencia: nos.filter(function (n) { return n.temFilhoPendente; }).length + (raizNo.item.state === 'RELEASED' && raizNo.filhos.some(function (f) { return f.paiLiberado; }) ? 1 : 0)
    };
  }

  // ---------- desenho da tela ----------
  var CORES = { RELEASED: '#0ca30c', FROZEN: '#2a78d6', IN_WORK: '#eb6834', PRIVATE: '#6250d6', OBSOLETE: '#8a8984', OUTRO: '#B4B8C0', FALTA: '#D5D8DE' };
  var abaAtiva = lerLocal('sm-aba') || '';

  function barraEstados(cont, total) {
    var ordem = ORDEM_EST.concat(Object.keys(cont).filter(function (s) { return ORDEM_EST.indexOf(s) < 0; }));
    var rot = ordem.filter(function (s) { return cont[s]; }).map(function (s) { return cont[s] + ' ' + rotulo(s).toLowerCase(); }).join(', ');
    var html = '<div class="sm-barra-est" role="img" aria-label="' + esc(rot) + '">';
    ordem.forEach(function (s) { if (cont[s]) html += '<div class="c-' + classeEst(s) + '" style="width:' + (cont[s] * 100 / (total || 1)) + '%" title="' + esc(rotulo(s) + ': ' + cont[s]) + '"></div>'; });
    return html + '</div>';
  }

  // gráfico de rosca em SVG; segs = [{ valor, cor, rotulo }]
  function rosca(segs, centro, sub, aria) {
    var total = 0; segs.forEach(function (s) { total += s.valor; });
    var r = 52, c = 2 * Math.PI * r, vis = segs.filter(function (s) { return s.valor > 0; }).length;
    var gap = vis > 1 ? 2.5 : 0, off = 0, arcos = '';
    segs.forEach(function (s) {
      if (!s.valor) return;
      var len = s.valor / total * c, tam = Math.max(len - gap, 0.8);
      arcos += '<circle r="' + r + '" cx="70" cy="70" fill="none" stroke="' + s.cor + '" stroke-width="18" stroke-dasharray="' + tam.toFixed(2) + ' ' + (c - tam).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)">' +
        '<title>' + esc(s.rotulo) + ': ' + s.valor + ' (' + pct(s.valor, total) + '%)</title></circle>';
      off += len;
    });
    return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="' + esc(aria) + '">' +
      '<circle r="' + r + '" cx="70" cy="70" fill="none" stroke="#EEF0F3" stroke-width="18"></circle>' + arcos +
      '<text x="70" y="70" text-anchor="middle" font-size="26" font-weight="700" fill="#17202A">' + esc(centro) + '</text>' +
      '<text x="70" y="90" text-anchor="middle" font-size="11" fill="#4B5563">' + esc(sub) + '</text></svg>';
  }

  function legenda(segs) {
    var total = 0; segs.forEach(function (s) { total += s.valor; });
    return '<ul class="sm-leg">' + segs.map(function (s) {
      return '<li><span class="q" style="background:' + s.cor + '"></span><span>' + esc(s.rotulo) + '</span><span class="n">' + s.valor + '</span><span class="p">' + pct(s.valor, total) + '%</span></li>';
    }).join('') + '</ul>';
  }

  function cartaoItens(d) {
    var total = d.unicos.length, lib = d.porEstado.RELEASED || 0;
    var ordem = ORDEM_EST.concat(Object.keys(d.porEstado).filter(function (s) { return ORDEM_EST.indexOf(s) < 0; }));
    var segs = ordem.filter(function (s) { return d.porEstado[s] || s === 'RELEASED' || s === 'IN_WORK'; })
      .map(function (s) { return { valor: d.porEstado[s] || 0, cor: CORES[s] || CORES.OUTRO, rotulo: rotulo(s) }; });
    return '<div class="sm-cartao"><h3 class="sm-cartao-t">Maturidade dos itens</h3>' +
      '<p class="sm-cartao-s">' + total + ' itens únicos · ' + d.nos.length + ' ocorrências</p>' +
      '<div class="sm-graf">' + rosca(segs, pct(lib, total) + '%', 'liberado', pct(lib, total) + '% dos itens liberados') + legenda(segs) + '</div></div>';
  }

  function cartaoDesenhos() {
    var cab = '<div class="sm-cartao"><h3 class="sm-cartao-t">Desenhos</h3><p class="sm-cartao-s">Peças, submontagens e a montagem principal</p>';
    if (desenhosEstado === '' || desenhosEstado === 'carregando') return cab + '<div class="sm-carregando">Consultando os desenhos na 3DX...</div></div>';
    if (desenhosEstado === 'erro') return cab + '<div class="sm-carregando">Não consegui ler os desenhos. Veja o diagnóstico técnico.</div></div>';
    var rd = resumoDesenhos();
    var segs = [
      { valor: rd.lib, cor: CORES.RELEASED, rotulo: 'Liberado' },
      { valor: rd.naoLib, cor: CORES.IN_WORK, rotulo: 'Não liberado' },
      { valor: rd.sem, cor: CORES.FALTA, rotulo: 'Sem desenho' }
    ];
    return cab + '<div class="sm-graf">' + rosca(segs, pct(rd.lib, rd.total) + '%', 'liberados', pct(rd.lib, rd.total) + '% dos itens com desenho liberado') + legenda(segs) + '</div></div>';
  }

  function cartaoMeta(d) {
    var total = d.unicos.length, lib = d.porEstado.RELEASED || 0;
    var meta = cfg.metaPct, atual = pct(lib, total);
    var faltam = Math.max(0, Math.ceil(meta * total / 100) - lib);
    var dias = null;
    if (cfg.metaData) { var t = Date.parse(cfg.metaData + 'T23:59:59'); if (!isNaN(t)) dias = Math.ceil((t - Date.now()) / 86400000); }
    var status, cls, ritmo = '—';
    if (faltam === 0) { status = 'Meta atingida'; cls = 's-ok'; }
    else if (dias === null) { status = 'Sem data de meta'; cls = 's-neutro'; }
    else if (dias < 0) { status = 'Prazo vencido'; cls = 's-vencido'; }
    else { status = 'Em andamento'; cls = 's-atencao'; ritmo = Math.ceil(faltam / Math.max(dias / 7, 1 / 7)) + '/sem'; }
    var largura = Math.min(atual, 100), alvo = Math.min(meta, 100);
    return '<div class="sm-cartao"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +

  function kpi(rotuloK, valor, detalhe, classe, cor) {

  function desenhosDe(no) { return desenhosEstado === 'ok' ? (desenhosLista[no.item.id] || []) : []; }

  var ICONE_2D = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M15 3v4h4"></path><path d="M8 17l3-5 2 3 1.5-2L17 17z"></path></svg>';

  function linhaDesenho(n, d) {
    var recuo = n.nivel * 22, dias = diasDesde(d.modified);

      '<td class="sm-celthumb"><div class="sm-thumb vazio" style="color:#4F5864">' + ICONE_2D + '</div></td>' +

  function desenharArvore() {
    if (!dados || !$('sm-arvore')) return;
    var linhas = [];   // { no } para itens 3D, { no, d } para desenhos 2D
    var cortado = false;
    (function percorrer(no) {
      for (var i = 0; i < no.filhos.length; i++) {
        if (linhas.length >= LIMITE_LINHAS) { cortado = true; return; }
        var f = no.filhos[i];
        linhas.push({ no: f });
        if (aberto[f.idx]) {
          desenhosDe(f).forEach(function (d) { linhas.push({ no: f, d: d }); });
          if (f.filhos.length) percorrer(f);
        }
      }
    })(dados.raiz);

    var html = '<table style="min-width:900px"><thead><tr><th class="num">Nível</th><th>Título</th><th>Thumbnail</th><th>Rev.</th><th>Estado</th><th>Desenho</th><th>Modificado</th><th>Owner</th><th class="num">Dias</th><th>Alertas</th></tr></thead><tbody>';
    var n3d = 0;
    linhas.forEach(function (l) {
      if (l.d) { html += linhaDesenho(l.no, l.d); return; }
      n3d++;
      var n = l.no;
      var it = n.item, recuo = (n.nivel - 1) * 22;
      var nDes = desenhosDe(n).length;
      var botao = temConteudo(n)
        ? '<button type="button" class="sm-tg" data-idx="' + n.idx + '" aria-expanded="' + (aberto[n.idx] ? 'true' : 'false') + '" aria-label="' + (aberto[n.idx] ? 'Recolher' : 'Expandir') + ' ' + esc(it.title || it.name) + '">' + (aberto[n.idx] ? ICONE_ABERTO : ICONE_FECHADO) + '</button>'
        : '<span class="sm-tg-vazio"></span>';
      var contagem = [];
      if (n.filhos.length) contagem.push(n.filhos.length);
      if (nDes) contagem.push(nDes + ' 2D');
      var alertas = '';
      if (n.temFilhoPendente) alertas += '<span class="sm-tag t-pai">filho pendente</span> ';
      if (n.paiLiberado) alertas += '<span class="sm-tag t-pai">pai liberado</span> ';
      if (n.parado) alertas += '<span class="sm-tag t-parado">parado</span>';
      html += '<tr' + (n.paiLiberado || n.temFilhoPendente ? ' class="marcada"' : '') + '>' +
        '<td class="num">' + n.nivel + '</td>' +
        '<td><span class="sm-nome" style="padding-left:' + recuo + 'px" title="' + esc(it.name) + '">' + botao + '<span' + (n.filhos.length ? ' style="font-weight:600"' : '') + '>' + esc(it.title || it.name) + '</span>' +
          (contagem.length ? '<span class="sm-filhos">(' + contagem.join(' · ') + ')</span>' : '') + '</span></td>' +
        '<td class="sm-celthumb">' + celulaThumb(it, n.idx) + '</td>' +
        '<td>' + esc(it.revision) + '</td>' +
        '<td><span class="sm-est e-' + esc(it.state) + '">' + esc(rotulo(it.state)) + '</span></td>' +
        '<td>' + tagDesenho(it) + '</td>' +
        '<td>' + esc(dataBR(it.modified)) + '</td><td>' + esc(it.owner) + '</td>' +
        '<td class="num">' + (n.dias === null ? '—' : n.dias) + '</td><td>' + (alertas || '') + '</td></tr>';
    });
    html += '</tbody></table>';
    $('sm-arvore').innerHTML = html;
    var abertos = Object.keys(aberto).length;
    $('sm-arvore-nota').textContent = 'Mostrando ' + n3d + ' de ' + dados.nos.length + ' itens 3D' + (linhas.length > n3d ? ' e ' + (linhas.length - n3d) + ' desenho(s) 2D' : '') +
      (abertos ? '' : ' · use as setas para abrir as submontagens e ver os desenhos') +
      (cortado ? ' · lista cortada em ' + LIMITE_LINHAS + ' linhas, use Exportar para ver tudo' : '') + '.';
  }

  // ---------- exportação ----------
  function exportar() {
    if (!dados) return;
    var sep = ';';
    function cel(v) { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    function des(it) { var s = statusDesenho(it); return s === null ? '' : s === 'FALTA' ? 'Falta' : s === 'ERRO' ? '' : rotulo(s); }
    var linhas = [['Nível', 'Item', 'Título', 'Revisão', 'Estado', 'Desenho', 'Owner', 'Modificado', 'Dias sem alteração', 'Alertas'].join(sep)];
    var r = dados.raiz.item;
    linhas.push(['0', r.name, r.title, r.revision, rotulo(r.state), des(r), r.owner, dataBR(r.modified), '', ''].map(cel).join(sep));
    (function percorrer(no) {
      no.filhos.forEach(function (n) {
        var it = n.item, a = [];
        if (n.temFilhoPendente) a.push('filho pendente');
        if (n.paiLiberado) a.push('pai liberado');
        if (n.parado) a.push('parado');
        if (it.state === 'RELEASED' && statusDesenho(it) && statusDesenho(it) !== 'RELEASED' && statusDesenho(it) !== 'ERRO') a.push('liberado sem desenho liberado');
        linhas.push([n.nivel, it.name, it.title, it.revision, rotulo(it.state), des(it), it.owner, dataBR(it.modified), n.dias === null ? '' : n.dias, a.join(', ')].map(cel).join(sep));
        percorrer(n);
      });
    })(dados.raiz);
    var conteudo = '﻿' + linhas.join('\r\n');
    var nome = 'status-' + String(r.title || r.name).replace(/[^\w.-]+/g, '_') + '.csv';
    try {
      var blob = new Blob([conteudo], { type: 'text/csv;charset=utf-8' });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) { window.navigator.msSaveOrOpenBlob(blob, nome); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nome;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 1000);
    } catch (e) {
      mostrarAviso('Não consegui baixar o arquivo: ' + esc(textoErro(e)), 'erro');
    }
  }

  // ---------- configurações ----------

    if (l >= 0) { cfg.limite = l; gravarLocal('sm-limite', String(l)); }
    if (m > 0 && m <= 100) { cfg.metaPct = m; gravarLocal('sm-meta', String(m)); }
    cfg.metaData = $('sm-data').value || ''; gravarLocal('sm-data', cfg.metaData);

      var antes = aberto;

  // ---------- início ----------
  function modoForaDoDashboard() {
    if (conectado) return;

  function iniciar() {
    var raizDom = (typeof widget !== 'undefined' && widget.body) ? widget.body : document.body;
    raizDom.innerHTML = TEMPLATE;
    registro = [];
    carregarCfg();
    $('sm-buscar').addEventListener('click', buscar);
    $('sm-nome').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') buscar(); });
    $('sm-atualizar').addEventListener('click', function () { if (bruto) ler(bruto.raiz); });
    $('sm-exportar').addEventListener('click', exportar);
    $('sm-config-btn').addEventListener('click', function () {
      var painel = $('sm-config'), abrir = painel.hasAttribute('hidden');
      if (abrir) painel.removeAttribute('hidden'); else painel.setAttribute('hidden', '');
      this.setAttribute('aria-expanded', abrir ? 'true' : 'false');
    });
    ['sm-limite', 'sm-meta', 'sm-data'].forEach(function (id) { $(id).addEventListener('change', mudouCfg); });
    // cliques dentro do conteúdo (escolha da busca, setas e botões da árvore)
    $('sm-conteudo').addEventListener('click', function (ev) {
      var alvo = ev.target;
      while (alvo && alvo !== this && !(alvo.classList && (alvo.classList.contains('sm-tg') || alvo.classList.contains('sm-thumb-btn') || alvo.classList.contains('sm-link2d') || alvo.classList.contains('sm-escolha') || alvo.classList.contains('sm-aba') || alvo.id === 'sm-exp-tudo' || alvo.id === 'sm-rec-tudo'))) alvo = alvo.parentNode;
      if (!alvo || alvo === this) return;
      if (alvo.classList.contains('sm-thumb-btn')) { abrirModal(Number(alvo.getAttribute('data-idx'))); return; }
      if (alvo.classList.contains('sm-link2d')) {
        var idDes = alvo.getAttribute('data-des');
        var achado = (desenhosLista[alvo.getAttribute('data-item')] || []).filter(function (x) { return x.id === idDes; })[0];
        if (achado) { var m = abrirPorLink({ id: achado.id, type: 'Drawing', title: achado.title, name: achado.name }, 'o desenho'); if (/bloqueou/.test(m)) mostrarAviso(m.replace(/^<div class="sm-aviso">|<\/div>$/g, '')); }
        return;
      }
      if (alvo.classList.contains('sm-aba')) { abaAtiva = alvo.getAttribute('data-aba'); gravarLocal('sm-aba', abaAtiva); desenhar(); return; }
      if (alvo.classList.contains('sm-escolha')) { ler(encontrados[Number(alvo.getAttribute('data-i'))]); return; }
      if (alvo.id === 'sm-exp-tudo') { expandirTudo(); return; }
      if (alvo.id === 'sm-rec-tudo') { aberto = {}; desenharArvore(); return; }
      var idx = Number(alvo.getAttribute('data-idx'));
      if (aberto[idx]) delete aberto[idx]; else aberto[idx] = true;
      desenharArvore();
    });
    // janela de detalhes: fechar clicando fora, no X, em Fechar ou com Esc
    $('sm-modal').addEventListener('click', function (ev) {
      var t = ev.target;
      if (t.id === 'sm-modal-fundo') { fecharModal(); return; }
      while (t && t !== this) {
        if (t.id === 'sm-modal-fechar' || t.id === 'sm-modal-fechar2') { fecharModal(); return; }
        if (t.id === 'sm-modal-3d') { abrir3D(); return; }
        if (t.id === 'sm-modal-2d') { if (noModal) abrir2D(melhorDesenho(noModal.item.id)); return; }
        t = t.parentNode;
      }
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && noModal) fecharModal(); });
    if (typeof require !== 'function') { modoForaDoDashboard(); return; }
    var esperando = setTimeout(function () { if (!WAF) modoForaDoDashboard(); }, 15000);
    require(['DS/WAFData/WAFData'], function (W) {
      clearTimeout(esperando);
      WAF = W;
      conectar();
      verificarModuloJanelas();
    }, function () { clearTimeout(esperando); modoForaDoDashboard(); });
  }

  if (typeof widget !== 'undefined' && widget.addEvent) widget.addEvent('onLoad', iniciar);
  else document.addEventListener('DOMContentLoaded', iniciar);

  // usado só para testes fora do dashboard
  window.__smTeste = { processar: function (raiz, membros, limite) { cfg.limite = limite || 15; bruto = { raiz: raiz, membros: membros, lido: '' }; processar(); return dados; } };
})();
</script>
