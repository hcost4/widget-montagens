<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
<head>
<meta charset="utf-8" />
<title>Status de Montagens</title>
<meta name="author" content="SKA" />
<meta name="apiVersion" content="1.3" />
<meta name="debugMode" content="false" />
<meta name="strictMode" content="false" />
<style>
  .sm-carregando { font-family: Arial, sans-serif; padding: 24px; color: #9AA0A6; background: #1A1A1A; min-height: 200px; }
  .sm-carregando button { margin-top: 12px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #BAD532; color: #1A1A1A; font-weight: 700; cursor: pointer; }
</style>
<script type="text/javascript">
  // Carregador: busca sempre a versão mais nova do app (sem cache) e roda aqui dentro.
  // Funciona tanto no 3DDashboard (Run Your App / app adicional) quanto aberto direto no navegador.
  // Este arquivo quase nunca muda; as atualizações vão no app.html.
  (function () {
    var BASE = 'https://hcost4.github.io/widget-montagens/';
    window.__smCarregador = true;
    function mensagem(html) {
      var alvo = (typeof widget !== 'undefined' && widget.body) ? widget.body : document.body;
      if (alvo) alvo.innerHTML = '<div class="sm-carregando">' + html + '</div>';
    }
    function erro(e) {
      mensagem('Não consegui carregar o app (' + String(e && e.message || e) + ').<br /><button type="button" onclick="location.reload()">Tentar de novo</button>');
    }
    fetch(BASE + 'app.html?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) {
        var doc = new DOMParser().parseFromString(t, 'text/html');
        // estilos e fontes do app
        Array.prototype.forEach.call(doc.head.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"], style'), function (n) {
          document.head.appendChild(document.importNode(n, true));
        });
        // código do app
        var codigo = Array.prototype.map.call(doc.querySelectorAll('script:not([src])'), function (s) { return s.textContent; }).join('\n');
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.text = codigo;
        document.head.appendChild(s);
      })
      .catch(erro);
  })();
</script>
</head>
<body>
<div class="sm-carregando">Carregando Status de Montagens...</div>
</body>
</html>
