<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Status de Montagens</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #1A1A1A; color: #C9CDD1; font-family: Arial, sans-serif; }
  .c { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font-size: 14px; }
  button { margin-top: 12px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #BAD532; color: #1A1A1A; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="c" id="msg">Carregando Status de Montagens...</div>
<script>
  // Carregador: busca sempre a versão mais nova do app (sem cache) e abre no lugar desta página.
  // Este arquivo quase nunca muda; as atualizações vão no app.html.
  (function () {
    function erro(e) {
      document.getElementById('msg').innerHTML = '<div>Não consegui carregar o app (' + String(e && e.message || e) + ').<br /><button type="button" onclick="location.reload()">Tentar de novo</button></div>';
    }
    fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (t) { document.open(); document.write(t); document.close(); })
      .catch(erro);
  })();
</script>
</body>
</html>
